# NOTE: ApplicationSetがtalosBootstrapのApplicationに、namePrefixとnamespaceを指定して追加
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - job.yaml
configMapGenerator:
  - name: talos-managed-fields-cleanup-script
    files:
      - cleanup.sh
    options:
      annotations:
        argocd.argoproj.io/hook: PostSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
        # NOTE: Jobより前に作成
        argocd.argoproj.io/sync-wave: "-1"
