apiVersion: batch/v1
kind: CronJob
metadata:
  name: sealed-secrets-backup
  namespace: sealed-secrets
spec:
  schedule: "36 * * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: sealed-secrets-backup
          restartPolicy: Never
          # NOTE: Vultrノードへのスケジューリングを許可
          tolerations:
            - key: edge
              operator: Exists
              effect: NoSchedule
          containers:
            - name: backup
              image: ghcr.io/cffnpwr/home-iac/sealed-secrets-backup:main@sha256:9c71fd0c06703c7392fbb24d0e8de3fe6685bc0b5d7951e9520ed877ded34aed
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  set -o pipefail

                  keys=$(kubectl get secrets -n sealed-secrets -l sealedsecrets.bitnami.com/sealed-secrets-key \
                    -o jsonpath='{range .items[*]}{.metadata.uid}{" "}{.metadata.name}{"\n"}{end}' | sort)
                  if [ -z "${keys}" ]; then
                    echo "sealed-secrets key not found" >&2
                    exit 1
                  fi

                  # NOTE: UIDの一覧のハッシュを名前にする
                  id=$(printf '%s\n' "${keys}" | cut -d ' ' -f 1 | sha256sum | cut -d ' ' -f 1)

                  # NOTE: 暗号化してから一時ファイルに置く
                  printf '%s\n' "${keys}" | cut -d ' ' -f 2 \
                    | xargs kubectl get secrets -n sealed-secrets -o yaml \
                    | age --encrypt --recipients-file /etc/sealed-secrets-backup/recipients.txt --output /tmp/keys.yaml.age
                  rclone copyto --ignore-existing /tmp/keys.yaml.age "r2:home-iac-sealed-secrets-keys/sealed-secrets-keys-${id}.yaml.age"
              env:
                - name: RCLONE_CONFIG_R2_TYPE
                  value: s3
                - name: RCLONE_CONFIG_R2_PROVIDER
                  value: Cloudflare
                - name: RCLONE_CONFIG_R2_REGION
                  value: auto
                - name: RCLONE_CONFIG_R2_ENDPOINT
                  value: https://086a84b440e09bc83330fe07f1966f5d.r2.cloudflarestorage.com
                # NOTE: rcloneによるバケットの確認・作成を止める
                - name: RCLONE_CONFIG_R2_NO_CHECK_BUCKET
                  value: "true"
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: sealed-secrets-backup-r2
                      key: access-key-id
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sealed-secrets-backup-r2
                      key: secret-access-key
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: recipients
                  mountPath: /etc/sealed-secrets-backup
                  readOnly: true
          volumes:
            - name: recipients
              configMap:
                name: sealed-secrets-backup-recipients
