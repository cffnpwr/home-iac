cloudflare:
  secretRef:
    name: cloudflare-tunnel-ingress-controller
    apiTokenKey: api-token
    accountIDKey: cloudflare-account-id
    tunnelNameKey: cloudflare-tunnel-name
replicaCount: 2
leaderElection:
  enabled: true
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: cloudflare-tunnel-ingress-controller
            app.kubernetes.io/instance: cloudflare-tunnel-ingress-controller
        topologyKey: kubernetes.io/hostname
cloudflared:
  image:
    repository: cloudflare/cloudflared
    # NOTE: chartの既定イメージは侵害されたeMudhraのCAを信頼したままのため、最新のイメージに差し替える
    # TODO: chartの既定イメージを最新のイメージに差し替えたPRがマージされたら削除
    tag: 2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
  replicaCount: 3
  # NOTE: pod-template-hashで同じリビジョンのPodだけを数え、更新中も追加のPodを置けるようにする
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: controlled-cloudflared-connector
      matchLabelKeys:
        - pod-template-hash
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  probes:
    # NOTE: metrics用のポートを監視
    liveness:
      httpGet:
        path: /ready
        port: 44483
      failureThreshold: 1
      initialDelaySeconds: 10
      periodSeconds: 10
