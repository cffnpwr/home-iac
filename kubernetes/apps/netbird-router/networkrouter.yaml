# NOTE: Operatorがこの名前のnetbird networkとルーティングピアのDeploymentを作成
#       自宅LANサブネットの宛先は、v1alpha1のNetworkResourceでCIDRを指定できないためダッシュボードで追加
apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: cffnpwr-home
  namespace: netbird
spec:
  # NOTE: Operatorは名前で検索するため、ダッシュボードで名前とドメインを同じにしたDNSゾーンが必要
  dnsZoneRef:
    name: cffnpwr-home.internal
  workloadOverride:
    # NOTE: 自宅LANのサブネットへ中継するため、自宅のノードに固定し、2台に1つずつ配置
    replicas: 2
    podTemplate:
      spec:
        nodeSelector:
          topology.kubernetes.io/zone: home
        # NOTE: Operatorにおける既定の配置条件は偏りを許容するため、必須条件で別々のノードに配置
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: networkrouter
                    app.kubernetes.io/instance: cffnpwr-home
        containers:
          - name: netbird
            env:
              # NOTE: Operatorに渡したURLはgRPCを受けないためクライアントはgatewayのgRPCに接続
              - name: NB_MANAGEMENT_URL
                value: https://nb.cffnpwr.dev:443
