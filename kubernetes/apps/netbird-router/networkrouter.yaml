# NOTE: Operatorが、この名前のnetbirdのnetworkと、そのルーティングピアのDeploymentを作成
#       自宅LANのサブネットの宛先は、v1alpha1のNetworkResourceがCIDRを指定できないため、ダッシュボードで追加
apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: cffnpwr-home
  namespace: netbird
  annotations:
    # NOTE: Operatorは削除されたNetworkRouterのnetworkを削除し、Network Resourceはダッシュボードで追加し直す必要があるため、Argo CDに削除させない
    argocd.argoproj.io/sync-options: Prune=false
spec:
  # NOTE: Operatorは名前で検索するため、ダッシュボードで名前とドメインを同じにしたDNSゾーンが必要
  dnsZoneRef:
    name: cffnpwr-home.internal
  workloadOverride:
    # NOTE: 自宅LANのサブネットへ中継するため、自宅のノードに固定し、2台に1つずつ配置
    replicas: 2
    podTemplate:
      spec:
        nodeSelector:
          topology.kubernetes.io/zone: home
        # NOTE: Operatorの既定の配置条件は偏りを許容するため、必須の条件で別々のノードに配置
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: networkrouter
                    app.kubernetes.io/instance: cffnpwr-home
        containers:
          - name: netbird
            env:
              # NOTE: Operatorに渡したURLはgRPCを受けないためクライアントはgatewayのgRPCに接続
              - name: NB_MANAGEMENT_URL
                value: https://nb.cffnpwr.dev:443
