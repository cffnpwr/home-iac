defaultRules:
  rules:
    # NOTE: Kubernetes / Compute Resources / *のダッシュボードが参照するrecording rule
    k8sContainerCpuUsageSecondsTotal: true
    k8sContainerMemoryCache: true
    k8sContainerMemoryRss: true
    k8sContainerMemorySwap: true
    k8sContainerMemoryWorkingSetBytes: true
    k8sContainerResource: true
    k8sPodOwner: true
    node: true
    # NOTE: Node Exporter / USE Methodのダッシュボードが参照するrecording rule
    #       このダッシュボードはNode Exporterと連動して作られ、個別に無効化できないため、データを表示できるようにする
    nodeExporterRecording: true
    # NOTE: Kubernetes / API serverのダッシュボードが参照するrecording rule
    kubeApiserverAvailability: true
    kubeApiserverHistogram: true
    # NOTE: 上記のダッシュボードが参照しないrecording rule
    kubeApiserverBurnrate: false
    kubelet: false
    kubePrometheusGeneral: false
    kubePrometheusNodeRecording: false
    kubeSchedulerRecording: false
    windows: false
    # NOTE: alert ruleはGrafanaの画面でGrafana-managed alert ruleとして管理するため、alerting ruleを作らない
    alertmanager: false
    etcd: false
    configReloaders: false
    general: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubeProxy: false
    kubernetesApps: false
    kubernetesResources: false
    kubernetesStorage: false
    kubernetesSystem: false
    kubeSchedulerAlerting: false
    kubeStateMetrics: false
    network: false
    nodeExporterAlerting: false
    prometheus: false
    prometheusOperator: false

# NOTE: alertはGrafanaのAlertmanagerが通知するため、Alertmanagerを使わない
alertmanager:
  enabled: false

# NOTE: GrafanaはgrafanaのApplicationで導入するため、ダッシュボードのConfigMapだけを出力
grafana:
  enabled: false
  forceDeployDashboards: true

# NOTE: メトリクスはAlloyが収集してMimirに送るため、Prometheusを使わない
prometheus:
  enabled: false

kubeApiServer:
  serviceMonitor:
    # NOTE: chartにおけるauthorizationの既定値はPrometheusとあわせて作られるSecretを参照するため削除
    #       Alloyのscrape classであるservice-account-tokenで、AlloyのService Accountトークンを用いて認証する
    authorization: null
    scrapeClass: service-account-token
    metricRelabelings:
      # NOTE: 監視項目が使うメトリクスに目印のラベル（__tmp_keep）を付け、目印を付けたメトリクスだけを収集する
      #
      # NOTE: 異常の検知: コンポーネントのバージョンの不一致
      - action: replace
        sourceLabels: [__name__]
        regex: (kubernetes_build_info)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: 異常の検知: Kubernetes APIのクライアントのエラー
      - action: replace
        sourceLabels: [__name__]
        regex: (rest_client_requests_total)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: 異常の検知: kube-apiserverのエラーの割合・遅延（SLO）
      - action: replace
        sourceLabels: [__name__]
        regex: (apiserver_request_sli_duration_seconds_bucket|apiserver_request_sli_duration_seconds_count|apiserver_request_total)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: 異常の検知: kube-apiserverが処理を中止したリクエスト
      - action: replace
        sourceLabels: [__name__]
        regex: (apiserver_request_terminations_total|apiserver_request_total)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: 異常の検知: aggregated API（metrics-server）の停止・エラー
      - action: replace
        sourceLabels: [__name__]
        regex: (aggregator_unavailable_apiservice|aggregator_unavailable_apiservice_total)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: 異常の検知: kube-apiserverへのクライアント証明書の期限
      - action: replace
        sourceLabels: [__name__]
        regex: (apiserver_client_certificate_expiration_seconds_bucket|apiserver_client_certificate_expiration_seconds_count)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: ダッシュボードでの調査: ダッシュボード「Kubernetes / API server」が表示する、上の監視項目にないメトリクス
      - action: replace
        sourceLabels: [__name__]
        regex: (go_goroutines|process_cpu_seconds_total|process_resident_memory_bytes|workqueue_adds_total|workqueue_depth|workqueue_queue_duration_seconds_bucket)
        targetLabel: __tmp_keep
        replacement: "true"
      - action: keep
        sourceLabels: [__tmp_keep]
        regex: "true"
      - action: labeldrop
        regex: __tmp_keep
      # NOTE: chartの既定値と同じ規則でヒストグラムのbucketのうち細かすぎるleを削除する
      - action: drop
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
        sourceLabels:
          - __name__
          - le

kubeControllerManager:
  # NOTE: Talosはkube-controller-managerにサービング証明書を渡さず、kube-controller-managerは自己署名の証明書を使うため、
  #       chartの既定値のtlsConfig.insecureSkipVerify: trueのままにする
  #       ref: https://github.com/siderolabs/talos/blob/v1.14.6/internal/app/machined/pkg/controllers/k8s/control_plane_final.go#L125-L126
  serviceMonitor:
    # NOTE: chartにおけるauthorizationの既定値はPrometheusとあわせて作られるSecretを参照するため削除
    #       Alloyのscrape classであるservice-account-tokenで、AlloyのService Accountトークンを用いて認証する
    authorization: null
    scrapeClass: service-account-token
    metricRelabelings:
      # NOTE: 監視項目が使うメトリクスに目印のラベル（__tmp_keep）を付け、目印を付けたメトリクスだけを収集する
      #
      # NOTE: 異常の検知: コンポーネントのバージョンの不一致
      - action: replace
        sourceLabels: [__name__]
        regex: (kubernetes_build_info)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: ダッシュボードでの調査: ダッシュボード「Kubernetes / Controller Manager」が表示する、上の監視項目にないメトリクス
      - action: replace
        sourceLabels: [__name__]
        regex: (go_goroutines|process_cpu_seconds_total|process_resident_memory_bytes|rest_client_request_duration_seconds_bucket|rest_client_requests_total|workqueue_adds_total|workqueue_depth|workqueue_queue_duration_seconds_bucket)
        targetLabel: __tmp_keep
        replacement: "true"
      - action: keep
        sourceLabels: [__tmp_keep]
        regex: "true"
      - action: labeldrop
        regex: __tmp_keep

kubeScheduler:
  # NOTE: Talosはkube-schedulerにサービング証明書を渡さず、kube-schedulerは自己署名の証明書を使うため、
  #       chartの既定値のtlsConfig.insecureSkipVerify: trueのままにする
  #       ref: https://github.com/siderolabs/talos/blob/v1.14.6/internal/app/machined/pkg/controllers/k8s/control_plane_final.go#L125-L126
  serviceMonitor:
    # NOTE: chartにおけるauthorizationの既定値はPrometheusとあわせて作られるSecretを参照するため削除
    #       Alloyのscrape classであるservice-account-tokenで、AlloyのService Accountトークンを用いて認証する
    authorization: null
    scrapeClass: service-account-token
    metricRelabelings:
      # NOTE: 監視項目が使うメトリクスに目印のラベル（__tmp_keep）を付け、目印を付けたメトリクスだけを収集する
      #
      # NOTE: 異常の検知: コンポーネントのバージョンの不一致
      - action: replace
        sourceLabels: [__name__]
        regex: (kubernetes_build_info)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: ダッシュボードでの調査: ダッシュボード「Kubernetes / Scheduler」が表示する、上の監視項目にないメトリクス
      - action: replace
        sourceLabels: [__name__]
        regex: (go_goroutines|process_cpu_seconds_total|process_resident_memory_bytes|rest_client_request_duration_seconds_bucket|rest_client_requests_total|scheduler_pod_scheduling_sli_duration_seconds_bucket|scheduler_pod_scheduling_sli_duration_seconds_count|scheduler_scheduling_algorithm_duration_seconds_bucket|scheduler_scheduling_algorithm_duration_seconds_count|scheduler_scheduling_attempt_duration_seconds_bucket|scheduler_scheduling_attempt_duration_seconds_count)
        targetLabel: __tmp_keep
        replacement: "true"
      - action: keep
        sourceLabels: [__tmp_keep]
        regex: "true"
      - action: labeldrop
        regex: __tmp_keep

kubeEtcd:
  service:
    # NOTE: etcdのmetricsを中継するkube-rbac-proxy（etcd-metrics-proxy.yaml）を収集対象にする
    port: 2382
    targetPort: 2382
    selector:
      app.kubernetes.io/name: etcd-metrics-proxy
  serviceMonitor:
    port: https-metrics
    scheme: https
    tlsConfig:
      # NOTE: kube-rbac-proxyは自己署名の証明書を使うため、Alloyはこの証明書を検証しない
      insecureSkipVerify: true
    # NOTE: chartにおけるauthorizationの既定値はPrometheusとあわせて作られるSecretを参照するため削除
    #       kube-rbac-proxyがAlloyのService Accountトークンを認可するため、scrape classのservice-account-tokenでリクエストにトークンを付与
    authorization: null
    scrapeClass: service-account-token
    metricRelabelings:
      # NOTE: 監視項目が使うメトリクスに目印のラベル（__tmp_keep）を付け、目印を付けたメトリクスだけを収集する
      #
      # NOTE: 異常の検知: 収集の失敗・コンポーネントの停止
      - action: replace
        sourceLabels: [__name__]
        regex: (etcd_network_peer_sent_failures_total)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: 異常の検知: etcdのleaderの有無・交代
      - action: replace
        sourceLabels: [__name__]
        regex: (etcd_server_has_leader|etcd_server_leader_changes_seen_total)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: 異常の検知: etcdのproposalの失敗
      - action: replace
        sourceLabels: [__name__]
        regex: (etcd_server_proposals_failed_total)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: 異常の検知: etcdのgRPCのエラー・遅延
      - action: replace
        sourceLabels: [__name__]
        regex: (grpc_server_handled_total|grpc_server_handling_seconds_bucket)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: 異常の検知: etcdのメンバー間通信の遅延・失敗
      - action: replace
        sourceLabels: [__name__]
        regex: (etcd_network_peer_round_trip_time_seconds_bucket|etcd_network_peer_sent_failures_total)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: 異常の検知: etcdのディスク書き込みの遅延（fsync・commit）
      - action: replace
        sourceLabels: [__name__]
        regex: (etcd_disk_backend_commit_duration_seconds_bucket|etcd_disk_wal_fsync_duration_seconds_bucket)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: 異常の検知: etcdのDBの容量・断片化
      - action: replace
        sourceLabels: [__name__]
        regex: (etcd_mvcc_db_total_size_in_bytes|etcd_mvcc_db_total_size_in_use_in_bytes|etcd_server_quota_backend_bytes)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: ダッシュボードでの調査: ダッシュボード「etcd」が表示する、上の監視項目にないメトリクス
      - action: replace
        sourceLabels: [__name__]
        regex: (etcd_network_client_grpc_received_bytes_total|etcd_network_client_grpc_sent_bytes_total|etcd_network_peer_received_bytes_total|etcd_network_peer_sent_bytes_total|grpc_server_started_total|process_resident_memory_bytes)
        targetLabel: __tmp_keep
        replacement: "true"
      - action: keep
        sourceLabels: [__tmp_keep]
        regex: "true"
      - action: labeldrop
        regex: __tmp_keep

coreDns:
  serviceMonitor:
    # NOTE: chartにおけるauthorizationの既定値はPrometheusとあわせて作られるSecretを参照するため削除
    #       CoreDNSのmetricsはHTTPで認証を行なわないため、トークンを付けるscrape classも指定しない
    authorization: null
    metricRelabelings:
      # NOTE: 監視項目が使うメトリクスに目印のラベル（__tmp_keep）を付け、目印を付けたメトリクスだけを収集する
      #
      # NOTE: 異常の検知: CoreDNSのエラー応答・応答の遅延（名前解決の失敗はクラスタ全体に影響するため）
      - action: replace
        sourceLabels: [__name__]
        regex: (coredns_dns_request_duration_seconds_bucket|coredns_dns_responses_total)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: ダッシュボードでの調査: ダッシュボード「CoreDNS」が表示する、上の監視項目にないメトリクス
      - action: replace
        sourceLabels: [__name__]
        regex: (coredns_cache_entries|coredns_cache_hits_total|coredns_cache_misses_total|coredns_dns_request_size_bytes_bucket|coredns_dns_requests_total|coredns_dns_response_size_bytes_bucket)
        targetLabel: __tmp_keep
        replacement: "true"
      - action: keep
        sourceLabels: [__tmp_keep]
        regex: "true"
      - action: labeldrop
        regex: __tmp_keep

# NOTE: kube-proxyは無効化しており（Ciliumのkube-proxy replacementを使用）、収集対象がないため、ServiceMonitor・ダッシュボード・ルールを作らない
kubeProxy:
  enabled: false

kubelet:
  serviceMonitor:
    # NOTE: chartにおけるauthorizationの既定値はPrometheusとあわせて作られるSecretを参照するため削除
    #       Alloyのscrape classであるservice-account-tokenで、AlloyのService Accountトークンを用いて認証する
    authorization: null
    scrapeClass: service-account-token
    tlsConfig:
      # NOTE: kubeletのサービング証明書はserverTLSBootstrapでクラスタのCAが署名するため、kube-root-ca.crtで検証
      insecureSkipVerify: false
    # NOTE: 収集対象を/metricsと/metrics/cadvisorに限定
    probes: false
    metricRelabelings:
      # NOTE: 監視項目が使うメトリクスに目印のラベル（__tmp_keep）を付け、目印を付けたメトリクスだけを収集する
      #
      # NOTE: 異常の検知: コンポーネントのバージョンの不一致
      - action: replace
        sourceLabels: [__name__]
        regex: (kubernetes_build_info)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: 異常の検知: PVCの容量・inodeの残り
      - action: replace
        sourceLabels: [__name__]
        regex: (kubelet_volume_stats_available_bytes|kubelet_volume_stats_capacity_bytes|kubelet_volume_stats_inodes|kubelet_volume_stats_inodes_free|kubelet_volume_stats_inodes_used|kubelet_volume_stats_used_bytes)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: 異常の検知: kubeletのPLEGの遅延・Podの起動の遅延
      - action: replace
        sourceLabels: [__name__]
        regex: (kubelet_node_name|kubelet_pleg_relist_duration_seconds_bucket|kubelet_pod_worker_duration_seconds_bucket)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: 異常の検知: kubeletの証明書の期限・更新の失敗
      - action: replace
        sourceLabels: [__name__]
        regex: (kubelet_certificate_manager_client_expiration_renew_errors|kubelet_certificate_manager_client_ttl_seconds|kubelet_certificate_manager_server_ttl_seconds|kubelet_server_expiration_renew_errors)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: 異常の検知: kubeletのPod数の上限・eviction
      - action: replace
        sourceLabels: [__name__]
        regex: (kubelet_evictions|kubelet_node_name|kubelet_running_pods)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: ダッシュボードでの調査: ダッシュボード「Kubernetes / Kubelet」が表示する、上の監視項目にないメトリクス
      - action: replace
        sourceLabels: [__name__]
        regex: (go_goroutines|kubelet_cgroup_manager_duration_seconds_bucket|kubelet_cgroup_manager_duration_seconds_count|kubelet_node_config_error|kubelet_pleg_relist_duration_seconds_count|kubelet_pleg_relist_interval_seconds_bucket|kubelet_pod_start_duration_seconds_bucket|kubelet_pod_start_duration_seconds_count|kubelet_pod_worker_duration_seconds_count|kubelet_running_containers|kubelet_runtime_operations_duration_seconds_bucket|kubelet_runtime_operations_errors_total|kubelet_runtime_operations_total|process_cpu_seconds_total|process_resident_memory_bytes|rest_client_request_duration_seconds_bucket|rest_client_requests_total|storage_operation_duration_seconds_bucket|storage_operation_duration_seconds_count|volume_manager_total_volumes)
        targetLabel: __tmp_keep
        replacement: "true"
      - action: keep
        sourceLabels: [__tmp_keep]
        regex: "true"
      - action: labeldrop
        regex: __tmp_keep
      # NOTE: chartの既定値と同じ規則でstorage_operation_duration_seconds_bucket・csi_operations_seconds_bucketのleの一部を削除する
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
    cAdvisorMetricRelabelings:
      # NOTE: 監視項目が使うメトリクスに目印のラベル（__tmp_keep）を付け、目印を付けたメトリクスだけを収集する
      #
      # NOTE: #100のリソースの計画: コンテナのCPUの使用量（CPUのrequestsの値を決める）
      - action: replace
        sourceLabels: [__name__]
        regex: (container_cpu_usage_seconds_total)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: #100のリソースの計画: CPUのスロットリング（CPUのlimitsが小さすぎないかを判断する）
      - action: replace
        sourceLabels: [__name__]
        regex: (container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: #100のリソースの計画: コンテナのメモリの使用量（メモリのrequests・limitsの値を決める）
      - action: replace
        sourceLabels: [__name__]
        regex: (container_memory_cache|container_memory_rss|container_memory_swap|container_memory_working_set_bytes)
        targetLabel: __tmp_keep
        replacement: "true"
      # NOTE: ダッシュボードでの調査: ダッシュボード「Kubernetes / Compute Resources / *」が表示する、上の監視項目にないメトリクス
      - action: replace
        sourceLabels: [__name__]
        regex: (container_fs_reads_bytes_total|container_fs_reads_total|container_fs_writes_bytes_total|container_fs_writes_total|container_network_receive_bytes_total|container_network_receive_packets_dropped_total|container_network_receive_packets_total|container_network_transmit_bytes_total|container_network_transmit_packets_dropped_total|container_network_transmit_packets_total)
        targetLabel: __tmp_keep
        replacement: "true"
      - action: keep
        sourceLabels: [__tmp_keep]
        regex: "true"
      - action: labeldrop
        regex: __tmp_keep
      # NOTE: chartの既定値と同じルールでCNI等が作るインターフェイス（cali・cilium・lxc等）のネットワークメトリクスを削除する
      #       chartはこのルールを、hostNetworkで動くコンテナのネットワークメトリクスを収集しないためのものと説明している
      #       ref: https://github.com/prometheus-community/helm-charts/blob/kube-prometheus-stack-93.3.0/charts/kube-prometheus-stack/values.yaml#L2001-L2006
      - sourceLabels: [__name__, interface]
        action: drop
        regex: "container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*"
      # NOTE: chartの既定値と同じ規則でPodに属さないcgroupのメトリクスを削除する
      - sourceLabels: [id, pod]
        action: drop
        regex: ".+;"

nodeExporter:
  operatingSystems:
    # NOTE: ノードはTalos Linuxだけのため、AIX・macOSのダッシュボードを作らない
    aix:
      enabled: false
    darwin:
      enabled: false

prometheusOperator:
  # NOTE: v1のEndpoints APIはKubernetes 1.33で非推奨のため、kubelet ServiceのEndpointSliceだけを作成
  kubeletEndpointsEnabled: false
  kubeletEndpointSliceEnabled: true
  serviceMonitor:
    # NOTE: Prometheus Operatorのメトリクスを参照するのはalerting ruleだけで、ダッシュボード・recording ruleは参照しないため収集しない
    selfMonitor: false
  resources:
    # TODO: 実測後に見直す
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  prometheus:
    monitor:
      http:
        metricRelabelings:
          # NOTE: 監視項目が使うメトリクスに目印のラベル（__tmp_keep）を付け、目印を付けたメトリクスだけを収集する
          #
          # NOTE: #100のリソースの計画: Podのrequests・limits（使用量との差を見る）
          - action: replace
            sourceLabels: [__name__]
            regex: (kube_pod_container_resource_limits|kube_pod_container_resource_requests)
            targetLabel: __tmp_keep
            replacement: "true"
          # NOTE: #100のリソースの計画: Podとワークロードの対応（ワークロードの単位で集計する）
          - action: replace
            sourceLabels: [__name__]
            regex: (kube_pod_info|kube_pod_owner|kube_replicaset_owner)
            targetLabel: __tmp_keep
            replacement: "true"
          # NOTE: #100のリソースの計画: ノードの割り当て可能な量（requestsの合計がノードに収まるかを判断する）
          - action: replace
            sourceLabels: [__name__]
            regex: (kube_node_status_allocatable|kube_node_status_capacity)
            targetLabel: __tmp_keep
            replacement: "true"
          # NOTE: 異常の検知: 収集の失敗・コンポーネントの停止
          - action: replace
            sourceLabels: [__name__]
            regex: (kube_node_info)
            targetLabel: __tmp_keep
            replacement: "true"
          # NOTE: 異常の検知: ノードのNotReady・Pressure・到達不能
          - action: replace
            sourceLabels: [__name__]
            regex: (kube_node_spec_taint|kube_node_spec_unschedulable|kube_node_status_condition)
            targetLabel: __tmp_keep
            replacement: "true"
          # NOTE: 異常の検知: PodのCrashLoopBackOff・長時間の待機・Not Ready
          - action: replace
            sourceLabels: [__name__]
            regex: (kube_pod_container_status_waiting_reason|kube_pod_owner|kube_pod_status_phase|kube_pod_status_ready|kube_pod_status_reason)
            targetLabel: __tmp_keep
            replacement: "true"
          # NOTE: 異常の検知: Deployment・StatefulSet・DaemonSetの台数の不一致・更新の停滞
          - action: replace
            sourceLabels: [__name__]
            regex: (kube_daemonset_status_current_number_scheduled|kube_daemonset_status_desired_number_scheduled|kube_daemonset_status_number_available|kube_daemonset_status_number_misscheduled|kube_daemonset_status_updated_number_scheduled|kube_deployment_metadata_generation|kube_deployment_spec_replicas|kube_deployment_status_condition|kube_deployment_status_observed_generation|kube_deployment_status_replicas_available|kube_deployment_status_replicas_updated|kube_statefulset_metadata_generation|kube_statefulset_replicas|kube_statefulset_status_current_revision|kube_statefulset_status_observed_generation|kube_statefulset_status_replicas_ready|kube_statefulset_status_replicas_updated|kube_statefulset_status_update_revision)
            targetLabel: __tmp_keep
            replacement: "true"
          # NOTE: 異常の検知: Jobの失敗・完了の遅れ
          - action: replace
            sourceLabels: [__name__]
            regex: (kube_job_failed|kube_job_labels|kube_job_status_active|kube_job_status_start_time)
            targetLabel: __tmp_keep
            replacement: "true"
          # NOTE: 異常の検知: HPAの台数
          - action: replace
            sourceLabels: [__name__]
            regex: (kube_horizontalpodautoscaler_spec_max_replicas|kube_horizontalpodautoscaler_spec_min_replicas|kube_horizontalpodautoscaler_status_current_replicas|kube_horizontalpodautoscaler_status_desired_replicas)
            targetLabel: __tmp_keep
            replacement: "true"
          # NOTE: 異常の検知: PDBを満たすPodの数
          - action: replace
            sourceLabels: [__name__]
            regex: (kube_poddisruptionbudget_status_current_healthy|kube_poddisruptionbudget_status_desired_healthy|kube_poddisruptionbudget_status_expected_pods)
            targetLabel: __tmp_keep
            replacement: "true"
          # NOTE: 異常の検知: requestsの合計がノードの割り当て可能な量を超えていないか
          - action: replace
            sourceLabels: [__name__]
            regex: (kube_node_role|kube_node_status_allocatable|kube_pod_container_resource_requests|kube_pod_status_phase)
            targetLabel: __tmp_keep
            replacement: "true"
          # NOTE: 異常の検知: PVCの容量・inodeの残り
          - action: replace
            sourceLabels: [__name__]
            regex: (kube_persistentvolumeclaim_access_mode|kube_persistentvolumeclaim_labels)
            targetLabel: __tmp_keep
            replacement: "true"
          # NOTE: 異常の検知: PVのプロビジョニングの失敗
          - action: replace
            sourceLabels: [__name__]
            regex: (kube_persistentvolume_status_phase)
            targetLabel: __tmp_keep
            replacement: "true"
          # NOTE: 異常の検知: kubeletのPod数の上限・eviction
          - action: replace
            sourceLabels: [__name__]
            regex: (kube_node_status_capacity)
            targetLabel: __tmp_keep
            replacement: "true"
          # NOTE: ダッシュボードでの調査: ダッシュボード「Kubernetes / Compute Resources / *」が表示する、上の監視項目にないメトリクス
          - action: replace
            sourceLabels: [__name__]
            regex: (kube_job_owner|kube_namespace_status_phase|kube_resourcequota)
            targetLabel: __tmp_keep
            replacement: "true"
          - action: keep
            sourceLabels: [__tmp_keep]
            regex: "true"
          - action: labeldrop
            regex: __tmp_keep
  resources:
    # TODO: 実測後に見直す
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

prometheus-node-exporter:
  # NOTE: Node ExporterはhostNetwork・hostPID・hostPathを使い、PodSecurityのbaselineで拒否されるため、
  #       privilegedを許可する専用のnamespaceに配置
  namespaceOverride: node-exporter
  prometheus:
    monitor:
      metricRelabelings:
        # NOTE: 監視項目が使うメトリクスに目印のラベル（__tmp_keep）を付け、目印を付けたメトリクスだけを収集する
        #
        # NOTE: #100のリソースの計画: ノードのCPU・メモリの使用量（ノードの余裕を見る）
        - action: replace
          sourceLabels: [__name__]
          regex: (node_cpu_seconds_total|node_memory_MemAvailable_bytes|node_memory_MemTotal_bytes)
          targetLabel: __tmp_keep
          replacement: "true"
        # NOTE: 異常の検知: ノードのディスクの容量・inodeの残り
        - action: replace
          sourceLabels: [__name__]
          regex: (node_filesystem_avail_bytes|node_filesystem_files|node_filesystem_files_free|node_filesystem_readonly|node_filesystem_size_bytes)
          targetLabel: __tmp_keep
          replacement: "true"
        # NOTE: 異常の検知: ノードのメモリの不足・major page fault
        - action: replace
          sourceLabels: [__name__]
          regex: (node_memory_MemAvailable_bytes|node_memory_MemTotal_bytes|node_vmstat_pgmajfault)
          targetLabel: __tmp_keep
          replacement: "true"
        # NOTE: 異常の検知: ノードのCPUの飽和
        - action: replace
          sourceLabels: [__name__]
          regex: (node_cpu_seconds_total|node_load1)
          targetLabel: __tmp_keep
          replacement: "true"
        # NOTE: 異常の検知: ノードのディスクI/Oの飽和
        - action: replace
          sourceLabels: [__name__]
          regex: (node_disk_io_time_weighted_seconds_total)
          targetLabel: __tmp_keep
          replacement: "true"
        # NOTE: 異常の検知: ノードのNICのエラー・リンクの状態
        - action: replace
          sourceLabels: [__name__]
          regex: (node_network_receive_errs_total|node_network_receive_packets_total|node_network_transmit_errs_total|node_network_transmit_packets_total|node_network_up)
          targetLabel: __tmp_keep
          replacement: "true"
        # NOTE: 異常の検知: ノードのconntrackの上限
        - action: replace
          sourceLabels: [__name__]
          regex: (node_nf_conntrack_entries|node_nf_conntrack_entries_limit)
          targetLabel: __tmp_keep
          replacement: "true"
        # NOTE: 異常の検知: ノードの時刻の同期
        - action: replace
          sourceLabels: [__name__]
          regex: (node_timex_maxerror_seconds|node_timex_offset_seconds|node_timex_sync_status)
          targetLabel: __tmp_keep
          replacement: "true"
        # NOTE: 異常の検知: ノードのfile descriptorの上限
        - action: replace
          sourceLabels: [__name__]
          regex: (node_filefd_allocated|node_filefd_maximum)
          targetLabel: __tmp_keep
          replacement: "true"
        # NOTE: ダッシュボードでの調査: ダッシュボード「Kubernetes / Compute Resources / *」が表示する、上の監視項目にないメトリクス
        - action: replace
          sourceLabels: [__name__]
          regex: (node_memory_Buffers_bytes|node_memory_Cached_bytes|node_memory_MemFree_bytes|node_memory_Slab_bytes)
          targetLabel: __tmp_keep
          replacement: "true"
        # NOTE: ダッシュボードでの調査: ダッシュボード「Kubernetes / Networking / *」が表示する、上の監視項目にないメトリクス
        - action: replace
          sourceLabels: [__name__]
          regex: (node_netstat_TcpExt_TCPSynRetrans|node_netstat_Tcp_OutSegs|node_netstat_Tcp_RetransSegs)
          targetLabel: __tmp_keep
          replacement: "true"
        # NOTE: ダッシュボードでの調査: ダッシュボード「Node Exporter / *」が表示する、上の監視項目にないメトリクス
        - action: replace
          sourceLabels: [__name__]
          regex: (node_disk_io_time_seconds_total|node_disk_read_bytes_total|node_disk_written_bytes_total|node_exporter_build_info|node_load15|node_load5|node_network_receive_bytes_total|node_network_receive_drop_total|node_network_transmit_bytes_total|node_network_transmit_drop_total|node_time_seconds|node_uname_info)
          targetLabel: __tmp_keep
          replacement: "true"
        - action: keep
          sourceLabels: [__tmp_keep]
          regex: "true"
        - action: labeldrop
          regex: __tmp_keep
  resources:
    # TODO: 実測後に見直す
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
