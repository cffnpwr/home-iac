# yaml-language-server: $schema=../../schemas/app.schema.json
# NOTE: monitoringのnamespaceにはalloyのApplicationも同期される
namespace: monitoring
chart:
  repoURL: https://prometheus-community.github.io/helm-charts
  name: kube-prometheus-stack
  version: 93.11.0
syncOptions:
  - CreateNamespace=true
manifests: true
# NOTE: 同じApplicationで作成するPrometheus OperatorのCRD登録が完了するまでServiceMonitor・PrometheusRuleの作成を再試行
retry:
  limit: 10
  backoff:
    duration: 30s
    factor: 2
    maxDuration: 10m
