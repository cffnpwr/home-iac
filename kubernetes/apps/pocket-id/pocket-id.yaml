apiVersion: v1
kind: Service
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  selector:
    app.kubernetes.io/name: pocket-id
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  namespace: pocket-id
  annotations:
    # NOTE: Pocket IDは設定・認証情報を起動したときにしか読まないため、Secretが変わったときにPodを作り直す
    secret.reloader.stakater.com/reload: pocket-id-cloudflare,pocket-id-keys,pocket-id-postgres-app
spec:
  # NOTE: Pocket IDは複数のレプリカに対応していないためreplicasは1に固定する
  # TODO: v3にアップグレードしたらreplicasを増やす
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocket-id
    spec:
      containers:
        - name: pocket-id
          image: ghcr.io/pocket-id/pocket-id:v2.19.2-distroless@sha256:a21166a4eb513d2ffcbf815398480998d996a9e719cfba029395517658626f9e
          env:
            - name: APP_URL
              value: https://auth.cffnpwr.dev
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pocket-id-keys
                  key: encryption-key
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: pocket-id-postgres-app
                  key: uri
            - name: FILE_BACKEND
              value: database
            # NOTE: Cloudflare Tunnelからしか到達できないため、Cloudflareが付けるヘッダーを信頼する
            - name: TRUSTED_PLATFORM
              value: CF-Connecting-IP
            - name: CLOUDFLARE_LOCATION_HEADERS
              value: "true"
            - name: UI_CONFIG_DISABLED
              value: "true"
            - name: EMAIL_VERIFICATION
              value: required
            - name: SMTP_HOST
              value: smtp.mx.cloudflare.net
            - name: SMTP_PORT
              value: "465"
            - name: SMTP_TLS
              value: tls
            # NOTE: Email ServiceのSMTPのユーザー名は`api_token`固定
            - name: SMTP_USER
              value: api_token
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pocket-id-cloudflare
                  key: smtp-password
            - name: SMTP_FROM
              value: noreply@cffnpwr.dev
          ports:
            - name: http
              containerPort: 1411
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            # TODO: 実測後に見直す
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
