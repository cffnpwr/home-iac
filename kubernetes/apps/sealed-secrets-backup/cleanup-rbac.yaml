apiVersion: v1
kind: ServiceAccount
metadata:
  name: sealed-secrets-key-cleanup
  namespace: sealed-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sealed-secrets-key-cleanup
  namespace: sealed-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sealed-secrets-key-cleanup
  namespace: sealed-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sealed-secrets-key-cleanup
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-key-cleanup
    namespace: sealed-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sealed-secrets-key-cleanup
rules:
  - apiGroups: [bitnami.com]
    resources: [sealedsecrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sealed-secrets-key-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sealed-secrets-key-cleanup
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-key-cleanup
    namespace: sealed-secrets
