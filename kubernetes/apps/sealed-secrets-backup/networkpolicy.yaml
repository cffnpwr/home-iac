# NOTE: 秘密鍵を含むstreamへの接続を、EventSourceとSensorのPodに限定
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eventbus-default
  namespace: sealed-secrets
spec:
  podSelector:
    matchLabels:
      controller: eventbus-controller
      eventbus-name: default
  policyTypes:
    - Ingress
  # NOTE: kubeletのprobeは、Ciliumが常にlocal hostからの通信を許可するため対象外
  ingress:
    - from:
        - podSelector:
            matchLabels:
              controller: eventsource-controller
        - podSelector:
            matchLabels:
              controller: sensor-controller
      ports:
        - protocol: TCP
          port: 4222
    # NOTE: JetStreamのレプリカ間の通信の許可
    - from:
        - podSelector:
            matchLabels:
              controller: eventbus-controller
              eventbus-name: default
      ports:
        - protocol: TCP
          port: 6222
