apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: eventbus-default
  namespace: sealed-secrets
spec:
  endpointSelector:
    matchLabels:
      controller: eventbus-controller
      eventbus-name: default
  ingress:
    # NOTE: 秘密鍵を含むstreamへの接続を、EventSourceとSensorのPodに限定
    - fromEndpoints:
        - matchLabels:
            controller: eventsource-controller
        - matchLabels:
            controller: sensor-controller
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    # NOTE: JetStreamのレプリカ間の通信の許可
    - fromEndpoints:
        - matchLabels:
            controller: eventbus-controller
            eventbus-name: default
      toPorts:
        - ports:
            - port: "6222"
              protocol: TCP
