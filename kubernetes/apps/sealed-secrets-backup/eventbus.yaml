# NOTE: EventSourceとSensorが既定で使う、同じnamespaceの`default`のEventBus
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: sealed-secrets
spec:
  jetstream:
    # NOTE: argo-events chartのconfigs.jetstream.versionsにあるバージョンだけ指定可能
    version: 2.10.29
    replicas: 3
    metadata:
      labels:
        # NOTE: 秘密鍵を含むstreamへの接続をEventSourceとSensorのPodに限定するため同じnamespaceのPodからの接続を拒否
        home-iac/same-namespace-ingress: deny
    # NOTE: 鍵のSecret全体を含むイベントを、streamに長く残さないための保持期間
    streamConfig: |
      maxAge: 30m
    containerTemplate:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                controller: eventbus-controller
                eventbus-name: default
            topologyKey: kubernetes.io/hostname
