operatorNamespace: rook-ceph
cephClusterSpec:
  # NOTE: Cephのデーモンを、永続化用のノード（terraform/main.tfのlocal.serversでceph_osdを指定したノード）に限定
  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: cffnpwr.dev/storage
                  operator: In
                  values:
                    - "true"
  storage:
    # NOTE: placementの条件を満たすノードをすべてOSDのノードにする
    useAllNodes: true
    useAllDevices: false
    # NOTE: TalosのRawVolumeConfig（ceph_osd）が作るパーティションだけをOSDに使う
    devicePathFilter: ^/dev/disk/by-partlabel/r-osd$
  # NOTE: CSIのcephxの鍵は、Linux 7.0より前のカーネルのクライアントのためにAESを使う（chartの既定値）。
  #       ノードのカーネルは7.0より前のため、AES256Kへの移行を求める警告を止める
  healthCheck:
    muteHealthWarning:
      AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
        policy: mute
      AUTH_INSECURE_CLIENT_KEY_TYPE:
        policy: mute
      AUTH_INSECURE_KEYS_ALLOWED:
        policy: mute
      AUTH_INSECURE_KEYS_CREATABLE:
        policy: mute
# NOTE: オブジェクトストレージは使わない
cephObjectStores: []
# NOTE: chartの既定値のCephFSを、MDSの要求量だけ変えて定義する。リストはchartの既定値と結合されないため、既定値をすべて記述
cephFileSystems:
  - name: ceph-filesystem
    spec:
      metadataPool:
        replicated:
          size: 3
      dataPools:
        - failureDomain: host
          replicated:
            size: 3
          name: data0
      metadataServer:
        activeCount: 1
        activeStandby: true
        resources:
          limits:
            memory: "4Gi"
          # NOTE: CephFSのボリュームが無く、MDSの使用量はCPU 3m・メモリ35Mi程度のためdrainで退避するPodの要求量を減らす
          requests:
            cpu: "100m"
            memory: "256Mi"
        priorityClassName: system-cluster-critical
    storageClass:
      enabled: true
      isDefault: false
      name: ceph-filesystem
      pool: data0
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: "Immediate"
      annotations: {}
      labels: {}
      mountOptions: []
      parameters:
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/controller-publish-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
        csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/fstype: ext4
