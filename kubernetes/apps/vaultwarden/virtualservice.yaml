# NOTE: cloudflaredは公開ホスト名をHostヘッダーに入れるため、sidecarがServiceのclusterに転送するよう指定
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  hosts:
    - vaultwarden.cffnpwr.dev
  http:
    - route:
        - destination:
            host: vaultwarden.vaultwarden.svc.cluster.local
            port:
              number: 80
