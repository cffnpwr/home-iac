# yaml-language-server: $schema=../../schemas/app.schema.json
namespace: vaultwarden
syncOptions:
  - CreateNamespace=true
# NOTE: Secretの変更時にReloaderがPodのテンプレートへ追加するアノテーション
ignoreDifferences:
  - group: apps
    kind: StatefulSet
    name: vaultwarden
    jsonPointers:
      - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
