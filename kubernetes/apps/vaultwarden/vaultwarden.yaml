apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  selector:
    app.kubernetes.io/name: vaultwarden
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
  annotations:
    # NOTE: vaultwardenは設定・鍵・認証情報を起動したときにしか読まないため、Secretの変更時にPodを作り直す
    secret.reloader.stakater.com/reload: vaultwarden-r2,vaultwarden-sso,vaultwarden-keys,vaultwarden-postgres-app
spec:
  replicas: 1
  # NOTE: vaultwardenは複数のレプリカに対応しない。更新時の停止を避けるため、新しいPodの準備ができてから古いPodを止める
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
        # NOTE: DISABLE_ADMIN_TOKENで管理画面の認証を無効にするため同じnamespaceのPodからの接続を拒否
        home-iac/same-namespace-ingress: deny
    spec:
      containers:
        - name: vaultwarden
          image: ghcr.io/cffnpwr/home-iac/vaultwarden:main@sha256:9bea2b90e0e8a77f078741914973fd505d227e28fab1e6b2ea6e15116156163b
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-postgres-app
                  key: uri
            - name: DOMAIN
              value: https://vaultwarden.cffnpwr.dev
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: IP_HEADER
              value: CF-Connecting-IP
            - name: EXPERIMENTAL_CLIENT_FEATURE_FLAGS
              value: ssh-agent-v2
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ONLY
              value: "true"
            - name: SSO_SIGNUPS_ALLOWED
              value: "false"
            # NOTE: Accessはoffline_accessを要求したときだけrefresh tokenを返す
            #       openidはvaultwardenが追加する
            - name: SSO_SCOPES
              value: email profile offline_access
            # NOTE: 管理画面の認証は、/adminを保護するAccessのapplicationで行なう
            #       管理画面で設定を保存すると、読み取り専用のconfig.jsonへの書き込みに失敗するため、設定を保存しない
            - name: DISABLE_ADMIN_TOKEN
              value: "true"
            - name: CONFIG_FILE
              value: /etc/vaultwarden/config/config.json
            # NOTE: vaultwardenは、この値に.pemを付けたファイルを読む
            - name: RSA_KEY_FILENAME
              value: /etc/vaultwarden/rsa-key/rsa_key
            - name: DATA_FOLDER
              value: /data
            - name: TMP_FOLDER
              value: /tmp/vaultwarden
            # NOTE: R2はINTELLIGENT_TIERINGのストレージクラスに対応しないためSTANDARDを指定
            - name: ATTACHMENTS_FOLDER
              value: s3://home-iac-vaultwarden-data/attachments?endpoint=https%3A%2F%2F086a84b440e09bc83330fe07f1966f5d.r2.cloudflarestorage.com&region=auto&default_storage_class=STANDARD
            - name: SENDS_FOLDER
              value: s3://home-iac-vaultwarden-data/sends?endpoint=https%3A%2F%2F086a84b440e09bc83330fe07f1966f5d.r2.cloudflarestorage.com&region=auto&default_storage_class=STANDARD
            - name: ICON_CACHE_FOLDER
              value: s3://home-iac-vaultwarden-data/icon_cache?endpoint=https%3A%2F%2F086a84b440e09bc83330fe07f1966f5d.r2.cloudflarestorage.com&region=auto&default_storage_class=STANDARD
            # NOTE: Web Vaultが、添付ファイルの署名付きURLへ接続するためのCSPの許可
            #       vaultwardenは、バケット名をホスト名に含むvirtual-hosted styleのURLを使う
            - name: ALLOWED_CONNECT_SRC
              value: https://home-iac-vaultwarden-data.086a84b440e09bc83330fe07f1966f5d.r2.cloudflarestorage.com
            # NOTE: S3バックエンドは、AWS SDKの既定の方法で認証情報を読む
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-r2
                  key: data-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-r2
                  key: data-secret-access-key
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /alive
              port: http
          resources:
            # TODO: 実測後に見直す
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp/vaultwarden
            - name: config
              mountPath: /etc/vaultwarden/config
              readOnly: true
            - name: rsa-key
              mountPath: /etc/vaultwarden/rsa-key
              readOnly: true
      volumes:
        # NOTE: DBはPostgreSQL、添付ファイル等はR2に置くため、DATA_FOLDERには永続化するデータが無い
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: config
          secret:
            secretName: vaultwarden-sso
            items:
              - key: config.json
                path: config.json
        - name: rsa-key
          secret:
            secretName: vaultwarden-keys
            items:
              - key: rsa_key.pem
                path: rsa_key.pem
