# yaml-language-server: $schema=../../schemas/app.schema.json
namespace: cert-manager
chart:
  repoURL: https://charts.jetstack.io
  name: cert-manager
  version: v1.21.3
syncOptions:
  - CreateNamespace=true
# NOTE: ClusterIssuerとCloudflare APIトークンのSealedSecretをchartとあわせて同期
manifests: true
# NOTE: cert-managerのwebhookが応答できるようになるまでClusterIssuerの作成が失敗するため再試行
retry:
  limit: 10
  backoff:
    duration: 30s
    factor: 2
    maxDuration: 10m
