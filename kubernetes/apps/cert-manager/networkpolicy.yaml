apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: webhook
      app.kubernetes.io/instance: cert-manager
  ingress:
    # NOTE: kube-apiserverがcert-managerのwebhookを呼ぶため接続を許可
    - fromEntities:
        # NOTE: 別のノードのkube-apiserverからの通信のidentityはremote-nodeとなる
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
