replicas: 2
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: metrics-server
            app.kubernetes.io/instance: metrics-server
        topologyKey: kubernetes.io/hostname
tolerations:
  # NOTE: Vultrノードへのスケジューリングを許可
  - key: edge
    operator: Exists
    effect: NoSchedule
resources:
  # TODO: chartの既定値。実測後に見直す
  requests:
    cpu: 100m
    memory: 200Mi
  # NOTE: control planeとメモリを奪い合わないようにlimitsを設定
  limits:
    memory: 200Mi
