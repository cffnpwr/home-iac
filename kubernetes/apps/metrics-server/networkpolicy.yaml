apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-server
  ingress:
    # NOTE: kube-apiserverがmetrics.k8s.ioのAPIのリクエストを転送するため接続を許可
    - fromEntities:
        # NOTE: 別のノードのkube-apiserverからの通信のidentityはremote-nodeとなる
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
