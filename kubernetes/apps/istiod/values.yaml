# NOTE: Istioのベストプラクティスに従う
#       ref: https://istio.io/latest/docs/ops/best-practices/deployment/#run-multiple-istiod-replicas
autoscaleMin: 2
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - istiod
        topologyKey: kubernetes.io/hostname
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - istiod
          topologyKey: topology.kubernetes.io/zone
# NOTE: chartの既定値（requests cpu 500m・memory 2048Mi）から下げる
resources:
  # TODO: 実測後に見直す
  requests:
    cpu: 100m
    memory: 100Mi
  limits:
    memory: 512Mi
# NOTE: PodSecurityのbaselineがistio-initの権限（NET_ADMIN・NET_RAW）を拒否するため、通信の経路をIstio CNIで設定
cni:
  enabled: true
sidecarInjectorWebhook:
  # NOTE: NetworkRouterのpodTemplateはラベルを指定できないため、WireGuardを使うルーティングピアをここで除外
  neverInjectSelector:
    - matchLabels:
        app.kubernetes.io/name: networkrouter
global:
  proxy:
    # NOTE: RPi4ではetcd・kube-apiserverとメモリを共有するため、chartの既定値から下げて上限を設定
    resources:
      # TODO: 実測後に見直す
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
base:
  # NOTE: Argo CDとistiodによる書き換えの繰り返しを防ぐために同じ値を指定
  validationFailurePolicy: Fail
