autoscaleEnabled: false
tolerations:
  # NOTE: Vultrノードへのスケジューリングを許可
  - key: edge
    operator: Exists
    effect: NoSchedule
# NOTE: 接続するプロキシがgatewayだけのため、chartの既定値（requests 2048Mi）から下げる
resources:
  # TODO: 実測後に見直す
  requests:
    cpu: 10m
    memory: 100Mi
  limits:
    memory: 512Mi
# NOTE: PodSecurityのbaselineがistio-initの権限（NET_ADMIN・NET_RAW）を拒否するため、通信の経路をIstio CNIで設定
cni:
  enabled: true
base:
  # NOTE: Argo CDとistiodによる書き換えの繰り返しを防ぐために同じ値を指定
  validationFailurePolicy: Fail
