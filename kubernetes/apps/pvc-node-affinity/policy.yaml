# NOTE: PVはCephのOSDがある自宅に置かれるため、PVCを使うPodは自宅のノードだけに配置する。
#       VultrノードではWAN越しのCephへの読み書きが遅延・中断し、PostgreSQL等が応答しなくなる。
#       taintはPodのボリュームに応じて効果を変えられないため、PodにnodeSelectorを付与
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: pvc-node-affinity
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    # NOTE: ephemeralのボリュームはPodの作成時にPVCを作りPVをCephに置くため対象にする
    - name: uses-pvc
      expression: >-
        has(object.spec.volumes) &&
        object.spec.volumes.exists(v, has(v.persistentVolumeClaim) || has(v.ephemeral))
  # NOTE: nodeSelectorはatomicなmapで、ApplyConfigurationでは変更できないためJSONPatchで追加
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          !has(object.spec.nodeSelector) ?
            [JSONPatch{
              op: "add",
              path: "/spec/nodeSelector",
              value: {"topology.kubernetes.io/zone": "home"}
            }] :
            [JSONPatch{
              op: "add",
              path: "/spec/nodeSelector/" + jsonpatch.escapeKey("topology.kubernetes.io/zone"),
              value: "home"
            }]
  # NOTE: 付与に失敗してもPodの作成を止めない
  failurePolicy: Ignore
  reinvocationPolicy: Never
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: pvc-node-affinity
spec:
  policyName: pvc-node-affinity
