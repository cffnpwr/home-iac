apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-backup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cffnpwr/home-iac.git
    targetRevision: main
    path: kubernetes/platform/sealed-secrets-backup
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # NOTE: CRDを作るargo-eventsのApplicationの同期完了までの再試行
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
