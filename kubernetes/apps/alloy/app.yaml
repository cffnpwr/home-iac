# yaml-language-server: $schema=../../schemas/app.schema.json
# NOTE: monitoringのnamespaceは、kube-prometheus-stackのApplicationも同期する
#       ServiceMonitor・PodMonitor・PrometheusRuleのCRDは、kube-prometheus-stackのApplicationが作成
namespace: monitoring
chart:
