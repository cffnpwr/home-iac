# yaml-language-server: $schema=../../schemas/app.schema.json
# NOTE: monitoringのnamespaceにはkube-prometheus-stackのApplicationも同期される
#       ServiceMonitor・PodMonitor・PrometheusRuleのCRDはkube-prometheus-stackのApplicationが作成
namespace: monitoring
chart:
  repoURL: https://grafana.github.io/helm-charts
  name: alloy
  version: 1.16.0
syncOptions:
  - CreateNamespace=true
