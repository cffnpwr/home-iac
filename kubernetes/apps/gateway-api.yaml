apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cffnpwr/home-iac.git
    targetRevision: main
    path: kubernetes/platform/gateway-api
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # NOTE: Gateway APIの公式の導入手順と同じserver-side applyで適用
      - ServerSideApply=true
