apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: istio-system-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    # NOTE: ラベルはPodを作れる全員が付けられるため、作成したユーザーも条件にする
    - name: not-istio-cni
      expression: >-
        !(
          request.userInfo.username == "system:serviceaccount:kube-system:daemon-set-controller" &&
          has(object.metadata.labels) &&
          "k8s-app" in object.metadata.labels &&
          object.metadata.labels["k8s-app"] == "istio-cni-node"
        )
  variables:
    - name: containers
      expression: >-
        object.spec.containers.map(c, dyn(c)) +
        (has(object.spec.initContainers) ? object.spec.initContainers.map(c, dyn(c)) : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers.map(c, dyn(c)) : [])
    # NOTE: PodSecurityのbaselineが追加を許可するcapability
    - name: allowedCapabilities
      expression: >-
        ["AUDIT_WRITE", "CHOWN", "DAC_OVERRIDE", "FOWNER", "FSETID", "KILL", "MKNOD",
         "NET_BIND_SERVICE", "SETFCAP", "SETGID", "SETPCAP", "SETUID", "SYS_CHROOT"]
  validations:
    - expression: >-
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork) &&
        !(has(object.spec.hostPID) && object.spec.hostPID) &&
        !(has(object.spec.hostIPC) && object.spec.hostIPC)
      message: hostNetwork, hostPID and hostIPC are not allowed for pods in istio-system
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))
      message: hostPath volumes are not allowed for pods in istio-system
    - expression: >-
        variables.containers.all(c,
          !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))
      message: hostPort is not allowed for pods in istio-system
    - expression: >-
        variables.containers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.privileged) ||
          !c.securityContext.privileged)
      message: privileged containers are not allowed for pods in istio-system
    - expression: >-
        variables.containers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.capabilities) ||
          !has(c.securityContext.capabilities.add) ||
          c.securityContext.capabilities.add.all(cap, cap in variables.allowedCapabilities))
      message: capabilities outside the Pod Security Standards baseline profile are not allowed for pods in istio-system
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: istio-system-pods
spec:
  policyName: istio-system-pods
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: istio-system
