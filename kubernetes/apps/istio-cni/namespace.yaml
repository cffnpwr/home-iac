apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  annotations:
    # NOTE: istiod・gatewayも置くnamespaceのため、Applicationの削除やファイルの削除で消さない
    argocd.argoproj.io/sync-options: Delete=false
  labels:
    # NOTE: istio-cniのhostPathとcapabilityを許可し、istio-cni以外のPodはistio-system-podsで制限
    pod-security.kubernetes.io/enforce: privileged
    # NOTE: baselineに違反するPodを、作成時の警告と監査ログで検出する
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
