# NOTE: kubernetes/apps/<name>/app.yamlのパラメーターから、<name>のApplicationを生成
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/cffnpwr/home-iac.git
        revision: main
        files:
          - path: kubernetes/apps/*/app.yaml
  template:
    metadata:
      name: "{{ .path.basename }}"
      annotations:
        # NOTE: Argo CDのclient-side applyはargocd-controllerのUpdate操作として記録されるため、
        #       server-side applyへの移行で既定のkubectl-client-side-applyの代わりに移行
        argocd.argoproj.io/client-side-apply-migration-manager: argocd-controller
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
  # NOTE: パラメーターの有無で変わる項目の付与
  #       chartがあればHelm chartを、無ければapp.yamlのディレクトリをKustomizeで同期
  #
  # NOTE: `.path`には`.path.path = kubernetes/apps/<name>`・`.path.basename = <name>`が入る
  templatePatch: |-
    spec:
      {{- if .chart }}
      sources:
        - repoURL: {{ .chart.repoURL }}
          chart: {{ .chart.name }}
          targetRevision: {{ .chart.version }}
          helm:
            {{- if .chart.releaseName }}
            releaseName: {{ .chart.releaseName }}
            {{- end }}
            valueFiles:
              - $values/{{ .path.path }}/values.yaml
            # NOTE: values.yamlを置かないchartの同期のため
            ignoreMissingValueFiles: true
        - repoURL: https://github.com/cffnpwr/home-iac.git
          targetRevision: main
          ref: values
        {{- if .talosBootstrap }}
        # NOTE: Talosのinline manifestが作成したリソースから、talosのmanagedFieldsのエントリを削除するPostSync hook
        #       Application間でクラスタスコープのリソース名が重複しないよう、Application名を接頭辞に付与
        - repoURL: https://github.com/cffnpwr/home-iac.git
          targetRevision: main
          path: kubernetes/hooks/talos-managed-fields-cleanup
          kustomize:
            namePrefix: {{ .path.basename }}-
            namespace: {{ .namespace }}
        {{- end }}
      {{- else }}
      source:
        repoURL: https://github.com/cffnpwr/home-iac.git
        targetRevision: main
        path: {{ .path.path }}
      {{- end }}
      {{- if .ignoreDifferences }}
      ignoreDifferences: {{ toJson .ignoreDifferences }}
      {{- end }}
      syncPolicy:
        # NOTE: すべてのApplicationをserver-side applyで同期
        syncOptions: {{ prepend (default (list) .syncOptions) "ServerSideApply=true" | toJson }}
        {{- if .retry }}
        retry: {{ toJson .retry }}
        {{- end }}
