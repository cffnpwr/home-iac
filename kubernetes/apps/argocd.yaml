# NOTE: 初回はTalosのinline manifestで導入し、以降の更新はこのApplicationで同期
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.10.5
      helm:
        # NOTE: Terraformが初回導入のhelm_templateのリリース名として参照するため明示
        releaseName: argocd
        valueFiles:
          - $values/kubernetes/platform/argocd/values.yaml
    - repoURL: https://github.com/cffnpwr/home-iac.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
