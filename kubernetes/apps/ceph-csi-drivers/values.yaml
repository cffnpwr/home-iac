# NOTE: Rookが推奨するvalues（rook/rook v1.21.1: deploy/charts/ceph-csi-drivers/values.yaml）。chartの既定値だけではドライバが動かない
#       ドライバの名前は、rook-ceph-clusterのStorageClassのprovisionerと一致させる
operatorConfig:
  namespace: rook-ceph
  driverSpecDefaults:
    imageSet:
      name: rook-csi-operator-image-set-configmap
    nodePlugin:
      priorityClassName: system-node-critical
    controllerPlugin:
      priorityClassName: system-cluster-critical
drivers:
  # NOTE: chartはドライバのtolerationsを常に空の配列で出力し、operatorはnilの場合だけdriverSpecDefaultsを使うため、ドライバごとに指定
  rbd:
    enabled: true
    name: rook-ceph.rbd.csi.ceph.com
    nodePlugin:
      tolerations:
        # NOTE: Vultrノードへのスケジューリングを許可
        - key: edge
          operator: Exists
          effect: NoSchedule
  cephfs:
    enabled: true
    name: rook-ceph.cephfs.csi.ceph.com
    nodePlugin:
      tolerations:
        # NOTE: Vultrノードへのスケジューリングを許可
        - key: edge
          operator: Exists
          effect: NoSchedule
  nfs:
    enabled: false
    name: rook-ceph.nfs.csi.ceph.com
  nvmeof:
    enabled: false
    name: rook-ceph.nvmeof.csi.ceph.com
