operatorConfig:
  namespace: rook-ceph
  driverSpecDefaults:
    imageSet:
      name: rook-csi-operator-image-set-configmap
    nodePlugin:
      priorityClassName: system-node-critical
    controllerPlugin:
      priorityClassName: system-cluster-critical
drivers:
  rbd:
    enabled: true
    name: rook-ceph.rbd.csi.ceph.com
    # NOTE: chartの既定値1がDriverに明示されるため、operatorの既定値2が使われない
    #       ノードの分散は、operatorが既定で付与するhostnameのrequiredのpodAntiAffinityを使う
    controllerPlugin:
      replicas: 2
  cephfs:
    enabled: true
    name: rook-ceph.cephfs.csi.ceph.com
    controllerPlugin:
      replicas: 2
  nfs:
    enabled: false
    name: rook-ceph.nfs.csi.ceph.com
  nvmeof:
    enabled: false
    name: rook-ceph.nvmeof.csi.ceph.com
extraDeploy:
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: rook-ceph.rbd.csi.ceph.com-ctrlplugin
      namespace: rook-ceph
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          app: rook-ceph.rbd.csi.ceph.com-ctrlplugin
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: rook-ceph.cephfs.csi.ceph.com-ctrlplugin
      namespace: rook-ceph
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          app: rook-ceph.cephfs.csi.ceph.com-ctrlplugin
