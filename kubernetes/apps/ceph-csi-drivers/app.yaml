# yaml-language-server: $schema=../../schemas/app.schema.json
namespace: rook-ceph
chart:
  repoURL: https://ceph.github.io/ceph-csi-operator
  name: ceph-csi-drivers
  version: 1.1.0
# NOTE: Ceph-CSI operatorのCRDを作るrook-cephのApplicationの同期完了までの再試行
retry:
  limit: 10
  backoff:
    duration: 30s
    factor: 2
    maxDuration: 10m
