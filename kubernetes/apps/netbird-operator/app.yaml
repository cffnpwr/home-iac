# yaml-language-server: $schema=../../schemas/app.schema.json
# NOTE: APIトークンのSecretとNetworkRouterは、netbirdのApplicationが同じnamespaceに作成
namespace: netbird
chart:
  # NOTE: OCIリポジトリにはArgo CDの指定方法に合わせて`oci://`を付けない
  repoURL: ghcr.io/netbirdio/helm-charts
  name: netbird-operator
  version: 0.9.0
# NOTE: chartがPodDisruptionBudgetを作らないため、PodDisruptionBudgetをchartとあわせて同期
manifests: true
# NOTE: namespaceを作成するnetbirdとCRDを作成するcert-managerの同期完了まで再試行
retry:
  limit: 10
  backoff:
    duration: 30s
    factor: 2
    maxDuration: 10m
