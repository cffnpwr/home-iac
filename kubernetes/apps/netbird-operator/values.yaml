# NOTE: REST APIは/apiを公開しているnetbird.cffnpwr.devで呼ぶ
#       netbird.cffnpwr.devはgRPCを受けないためルーティングピアのクライアントが接続するURLはNetworkRouterのpodTemplateで上書き
managementURL: https://netbird.cffnpwr.dev
webhook:
  # NOTE: Pod作成時にsidecarを追加するmutating webhookは無効にできず、failurePolicy: Failのため
  #       Operatorの停止中にPodを作れなくなる。sidecarを使わないため、どのnamespaceにも一致させない
  namespaceSelectors:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
        - netbird-operator-webhook-disabled
operator:
  replicaCount: 3
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: netbird-operator
              app.kubernetes.io/instance: netbird-operator
          topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
