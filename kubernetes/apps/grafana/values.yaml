# NOTE: Grafanaは設定・認証情報を起動したときにしか読まないため、Secretが変わったときにPodを作り直す
annotations:
  secret.reloader.stakater.com/reload: grafana-oidc,grafana-postgres-app,grafana-smtp

replicas: 2
# NOTE: 通知の重複を防ぐため、2台のGrafanaのAlertmanagerが送信状況をgossipで共有できるよう、各PodのIPアドレスを返すheadless Serviceを作成
#       ref: https://github.com/grafana/grafana/blob/v13.3.1/docs/sources/alerting/set-up/configure-high-availability/_index.md
headlessService: true
# NOTE: Istioはポート名の`-`より前の部分でプロトコルを判定するため、headless ServiceのgossipポートをTCPとして扱わせる
#       ref: https://github.com/istio/istio.io/blob/release-1.32/content/en/docs/ops/configuration/traffic-management/protocol-selection/index.md
gossipPortName: tcp-gossip
podDisruptionBudget:
  maxUnavailable: 1
# NOTE: nodeTaintsPolicy: HonorでPodが許容しないtaintを持つノード（drain中にcordonされたノード等）をskewの計算から除外
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: grafana
    matchLabelKeys:
      - pod-template-hash
    nodeTaintsPolicy: Honor

resources:
  # TODO: 実測後に見直す
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

service:
  portName: http
  appProtocol: http

ingress:
  enabled: true
  ingressClassName: cloudflare-tunnel
  hosts:
    - grafana.cffnpwr.dev

# NOTE: chartはgrafana.iniをConfigMapに置くため、Secretの値は環境変数で渡し、grafana.iniの`$__env{...}`で展開
envValueFrom:
  OIDC_ISSUER:
    secretKeyRef:
      name: grafana-oidc
      key: issuer
  OIDC_CLIENT_ID:
    secretKeyRef:
      name: grafana-oidc
      key: client-id
  OIDC_CLIENT_SECRET:
    secretKeyRef:
      name: grafana-oidc
      key: client-secret
  # NOTE: `uri`はスキームが`postgresql`で、Grafanaがdatabase.urlのtypeとして受け付けないため、項目ごとに渡す
  DATABASE_HOST:
    secretKeyRef:
      name: grafana-postgres-app
      key: host
  DATABASE_PORT:
    secretKeyRef:
      name: grafana-postgres-app
      key: port
  DATABASE_NAME:
    secretKeyRef:
      name: grafana-postgres-app
      key: dbname
  DATABASE_USER:
    secretKeyRef:
      name: grafana-postgres-app
      key: user
  DATABASE_PASSWORD:
    secretKeyRef:
      name: grafana-postgres-app
      key: password
  SMTP_PASSWORD:
    secretKeyRef:
      name: grafana-smtp
      key: smtp-password
env:
  # NOTE: ログインフォームと基本認証を無効にするため、初回起動時に管理者ユーザーを作らない
  GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"

grafana.ini:
  server:
    root_url: https://grafana.cffnpwr.dev/
  database:
    type: postgres
    host: $__env{DATABASE_HOST}:$__env{DATABASE_PORT}
    name: $__env{DATABASE_NAME}
    user: $__env{DATABASE_USER}
    password: $__env{DATABASE_PASSWORD}
    # NOTE: sidecarを注入しないPostgreSQLへの接続はIstioのmTLSで暗号化されないためTLSを必須にする
    ssl_mode: require
  auth:
    disable_login_form: true
  auth.basic:
    enabled: false
  auth.generic_oauth:
    enabled: true
    name: Cloudflare Access
    client_id: $__env{OIDC_CLIENT_ID}
    client_secret: $__env{OIDC_CLIENT_SECRET}
    # NOTE: Accessはoffline_accessを要求したときだけrefresh tokenを返す
    scopes: openid email profile groups offline_access
    auth_url: $__env{OIDC_ISSUER}/authorization
    token_url: $__env{OIDC_ISSUER}/token
    api_url: $__env{OIDC_ISSUER}/userinfo
    # NOTE: role_attribute_pathを最初にID tokenで評価するため、ID tokenの署名を検証
    validate_id_token: true
    jwk_set_url: $__env{OIDC_ISSUER}/jwks
    use_pkce: true
    use_refresh_token: true
    role_attribute_path: "contains(groups[*], 'app-grafana-admin') && 'Admin' || 'Viewer'"
  # NOTE: Grafana-managed alert ruleでemailのcontact pointが通知に使うSMTPサーバー
  smtp:
    enabled: true
    # NOTE: Cloudflare Email ServiceのSMTPは465番ポートのimplicit TLSだけを受け付ける
    #       Grafanaはポートが465のときimplicit TLSで接続する
    #       ref: https://developers.cloudflare.com/email-service/api/send-emails/smtp/
    #       ref: https://github.com/grafana/grafana/blob/v13.3.1/docs/sources/setup-grafana/configure-grafana/_index.md
    host: smtp.mx.cloudflare.net:465
    # NOTE: Email ServiceのSMTPユーザー名は`api_token`固定
    user: api_token
    password: $__env{SMTP_PASSWORD}
    from_address: noreply@cffnpwr.dev
  unified_alerting:
    # NOTE: AlertmanagerのgossipをPodのIPアドレスで待ち受け、headless Serviceで互いを見つける
    #       KubernetesではPodの作り直しでIPアドレスが変わるため、停止したピアへの再接続を試みる時間を短くする
    #       ref: https://github.com/grafana/grafana/blob/v13.3.1/docs/sources/alerting/set-up/configure-high-availability/_index.md
    ha_listen_address: ${POD_IP}:9094
    ha_advertise_address: ${POD_IP}:9094
    ha_peers: grafana-headless:9094
    ha_reconnect_timeout: 2m

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        uid: mimir
        type: prometheus
        access: proxy
        url: http://mimir-query-frontend.mimir.svc.cluster.local:8080/prometheus
        # NOTE: kube-prometheus-stackのダッシュボードはデータソース変数の既定値で既定のデータソースを参照するため、既定に設定
        isDefault: true
        editable: false
        jsonData:
          prometheusType: Mimir
          # NOTE: Grafanaは$__rate_intervalの計算にこの値を使うため、使用中の最長のscrape間隔に設定
          #       ref: https://grafana.com/docs/grafana/latest/datasources/prometheus/template-variables/
          timeInterval: 30s
          # NOTE: alert ruleはGrafana-managed alert ruleで管理し、Mimirのrulerにはkube-prometheus-stackのrecording ruleだけを置く
          #       データソースのURLが指すquery-frontendはrulerのAPIを提供しないため、Alerting UIでMimirのruleを扱わない
          #       ref: https://github.com/grafana/grafana/blob/v13.3.1/docs/sources/datasources/prometheus/configure/_index.md
          manageAlerts: false

# NOTE: 既定のClusterRoleは全namespaceのSecret読み取りを許可するため、namespaceごとのRoleを作成
rbac:
  namespaced: true
  namespaces:
    - monitoring

sidecar:
  resources:
    # TODO: 実測後に見直す
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  dashboards:
    enabled: true
    labelValue: "1"
    searchNamespace:
      - monitoring
    resource: configmap
    skipReload: true
