apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-postgres
  namespace: grafana
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: grafana-postgres
  ingress:
    # NOTE: CloudNativePGのoperatorがPostgreSQLの状態を取得するためoperatorからの接続を許可
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-alerting-gossip
  namespace: grafana
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: grafana
  ingress:
    # NOTE: 通知の重複を防ぐため、2台のGrafanaのAlertmanagerが送信状況をTCP・UDPの9094番ポートでgossipできるようGrafana間の接続を許可
    #       ref: https://github.com/grafana/grafana/blob/v13.3.1/docs/sources/alerting/set-up/configure-high-availability/_index.md
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
            app.kubernetes.io/instance: grafana
      toPorts:
        - ports:
            - port: "9094"
              protocol: TCP
            - port: "9094"
              protocol: UDP
