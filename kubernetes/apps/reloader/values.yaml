reloader:
  # NOTE: ApplicationのignoreDifferencesでアノテーションを無視する
  reloadStrategy: annotations
  enableHA: true
  deployment:
    replicas: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: reloader-reloader
            release: reloader
        matchLabelKeys:
          - pod-template-hash
        nodeTaintsPolicy: Honor
    resources:
      # TODO: chartの例の値。実測後に見直す
      requests:
        cpu: 10m
        memory: 128Mi
      # NOTE: control planeとメモリを奪い合わないようにlimitsを設定
      limits:
        memory: 512Mi
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
