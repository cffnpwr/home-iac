global:
  # NOTE: mimir.structuredConfigのR2の認証情報は、Secretのmimir-r2から渡す環境変数で展開するため指定
  #       chartはすべてのコンポーネントを-config.expand-env=trueで起動する
  #       mimir-r2は、CIがTerraformのoutputからSealedSecretとして作る
  extraEnv:
    - name: R2_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: mimir-r2
          key: access-key-id
    - name: R2_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: mimir-r2
          key: secret-access-key

mimir:
  structuredConfig:
    multitenancy_enabled: false
    common:
      storage:
        backend: s3
        s3:
          endpoint: 086a84b440e09bc83330fe07f1966f5d.r2.cloudflarestorage.com
          region: auto
          bucket_name: home-iac-mimir
          access_key_id: "${R2_ACCESS_KEY_ID}"
          secret_access_key: "${R2_SECRET_ACCESS_KEY}"
    # NOTE: blocksはrulerと同じバケットの同じprefixに置くとMimirが起動しないため、prefixで分ける
    #       ref: https://github.com/grafana/mimir/blob/mimir-3.2.3/docs/sources/mimir/configure/configure-object-storage-backend.md
    blocks_storage:
      storage_prefix: blocks
    ruler_storage:
      storage_prefix: ruler
    ingest_storage:
      kafka:
        # NOTE: chartはkafka.enabledが真のときだけaddressを描画するため、Strimziのbootstrapのアドレスを指定
        address: kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
        # NOTE: kafkaのApplicationのKafkaTopicと同じ名前にするため明示
        topic: mimir-ingest
        # NOTE: トピックはKafkaTopicで事前に作るため、Mimirによる作成を無効化
        auto_create_topic_enabled: false
    limits:
      # NOTE: R2のブロックを1年間保持
      compactor_blocks_retention_period: 1y
    ruler:
      # NOTE: chartはAlertmanagerを無効にしても、存在しないAlertmanagerのheadless Serviceをalertmanager_urlに設定するため、alertmanager_urlを空にする
      #       alertmanager_urlは非推奨で、空でない場合はlimits.ruler_alertmanager_client_config.alertmanager_urlより優先される
      #       ref: https://github.com/grafana/mimir/blob/mimir-distributed-6.2.2/operations/helm/charts/mimir-distributed/values.yaml#L290-L291
      #       ref: https://github.com/grafana/mimir/blob/mimir-3.2.3/pkg/mimir/modules.go#L435-L440
      alertmanager_url: ""

# NOTE: alert ruleはGrafana-managed alert ruleとしてGrafanaが評価し、GrafanaのAlertmanagerが通知するため無効化
#       rulerはkube-prometheus-stackのrecording ruleだけを評価する
alertmanager:
  enabled: false

# NOTE: object storageはR2、KafkaはStrimziのクラスタを使うため、chartに同梱のものを無効化
minio:
  enabled: false
kafka:
  enabled: false

# NOTE: AlloyとGrafanaは各コンポーネントのServiceに直接接続するため無効化
gateway:
  enabled: false

# NOTE: 収集対象にMimirを含めないため無効化
overrides_exporter:
  enabled: false

rollout_operator:
  enabled: true
  resources:
    # TODO: 実測後に見直す
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 200Mi

distributor:
  replicas: 2
  topologySpreadConstraints:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    matchLabelKeys:
      - pod-template-hash
    nodeTaintsPolicy: Honor
  resources:
    # TODO: 実測後に見直す
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

ingester:
  replicas: 2
  persistentVolume:
    storageClass: ceph-block
  zoneAwareReplication:
    topologyKey: kubernetes.io/hostname
    zones:
      - name: zone-a
        prepareDownscale: true
      - name: zone-b
        prepareDownscale: true
  resources:
    # TODO: 実測後に見直す
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

store_gateway:
  replicas: 3
  persistentVolume:
    storageClass: ceph-block
  zoneAwareReplication:
    topologyKey: kubernetes.io/hostname
  resources:
    # TODO: 実測後に見直す
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

compactor:
  persistentVolume:
    storageClass: ceph-block
  resources:
    # TODO: 実測後に見直す
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

querier:
  replicas: 2
  topologySpreadConstraints:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    matchLabelKeys:
      - pod-template-hash
    nodeTaintsPolicy: Honor
  resources:
    # TODO: 実測後に見直す
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

query_frontend:
  # NOTE: Mimirのドキュメントが高可用性のために2台以上を推奨
  #       ref: https://github.com/grafana/mimir/blob/mimir-3.2.3/docs/sources/mimir/references/architecture/components/query-frontend/index.md
  replicas: 2
  topologySpreadConstraints:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    matchLabelKeys:
      - pod-template-hash
    nodeTaintsPolicy: Honor
  resources:
    # TODO: 実測後に見直す
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# NOTE: Mimir 3.0から、query-frontendとquerierはquery-schedulerを必ず経由するため有効化
#       ref: https://github.com/grafana/mimir/blob/mimir-3.2.3/CHANGELOG.md
query_scheduler:
  enabled: true
  # NOTE: Mimirのドキュメントが高可用性のために2台を推奨
  #       ref: https://github.com/grafana/mimir/blob/mimir-3.2.3/docs/sources/mimir/references/architecture/components/query-scheduler/index.md
  replicas: 2
  topologySpreadConstraints:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    matchLabelKeys:
      - pod-template-hash
    nodeTaintsPolicy: Honor
  resources:
    # TODO: 実測後に見直す
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

# NOTE: kube-prometheus-stackのrecording ruleを評価するため有効化
ruler:
  enabled: true
  replicas: 2
  topologySpreadConstraints:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    matchLabelKeys:
      - pod-template-hash
    nodeTaintsPolicy: Honor
  # NOTE: GoのGCの目標のヒープはballastを含む生存ヒープに比例し、chartの既定の1GiBのballastではballast以外の確保がlimitsの1Giを超えうるため無効化
  #       ref: https://go.dev/doc/gc-guide
  memBallastSizeBytes: 0
  resources:
    # TODO: 実測後に見直す
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
