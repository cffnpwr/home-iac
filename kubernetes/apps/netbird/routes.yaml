apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: netbird
  namespace: netbird
spec:
  parentRefs:
    - name: ingress
      namespace: istio-system
      sectionName: https
  hostnames:
    - nb.cffnpwr.dev
  rules:
    - matches:
        - method:
            service: management.ManagementService
      backendRefs:
        - name: netbird-management-grpc
          port: 80
    - matches:
        - method:
            service: signalexchange.SignalExchange
      backendRefs:
        - name: netbird-signal-grpc
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird
  namespace: netbird
spec:
  parentRefs:
    - name: ingress
      namespace: istio-system
      sectionName: https
  hostnames:
    - nb.cffnpwr.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /relay
      backendRefs:
        - name: netbird-relay
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /ws-proxy/management
      backendRefs:
        - name: netbird-management
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /ws-proxy/signal
      backendRefs:
        - name: netbird-signal
          port: 80
