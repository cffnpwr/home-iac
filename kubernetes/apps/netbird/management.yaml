apiVersion: v1
kind: Service
metadata:
  name: netbird-management
  namespace: netbird
spec:
  selector:
    app.kubernetes.io/name: netbird-management
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
---
# NOTE: managementは同じポートでgRPCとHTTPを受けるため、gatewayからHTTP/2で転送するgRPC用のService
apiVersion: v1
kind: Service
metadata:
  name: netbird-management-grpc
  namespace: netbird
spec:
  selector:
    app.kubernetes.io/name: netbird-management
  ports:
    - name: grpc
      port: 80
      targetPort: http
      appProtocol: kubernetes.io/h2c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-management
  namespace: netbird
spec:
  replicas: 1
  # NOTE: OSS版のmanagementは複数のレプリカに対応しない。更新時の停止を避けるため、新しいPodの準備ができてから古いPodを止める
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird-management
    spec:
      containers:
        - name: management
          image: netbirdio/management:0.82.0@sha256:07c8f979fcc980678cc64e584cf6b7b27204ceb4c871531b29e2dce39592e9ff
          env:
            - name: NETBIRD_ACCESS_ISSUER
              valueFrom:
                secretKeyRef:
                  name: netbird-cloudflare
                  key: access-issuer
            - name: NETBIRD_ACCESS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: netbird-cloudflare
                  key: access-client-id
            - name: NETBIRD_ACCESS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: netbird-cloudflare
                  key: access-client-secret
            - name: NETBIRD_DATASTORE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: datastore-encryption-key
            - name: NETBIRD_RELAY_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: relay-auth-secret
            # NOTE: dashboardの初期設定画面を省略するための、ログインできないOwner
            - name: NETBIRD_PLACEHOLDER_OWNER_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: placeholder-owner-password-hash
            # NOTE: management.jsonを介さずmanagementが読む、組み込みIdPのCookieの暗号化鍵
            - name: NB_IDP_SESSION_COOKIE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: idp-session-cookie-encryption-key
            # NOTE: CloudNativePGが生成するパスワードは英数字だけのため、key=value形式のDSNに引用符なしで埋め込む
            - name: NETBIRD_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbird-postgres-app
                  key: password
            # NOTE: 組み込みIdP（Dex）にはCAの証明書を渡せず、sslmodeを省略するとverify-fullになるため、3つのDSNをrequireで揃える
            - name: NB_STORE_ENGINE_POSTGRES_DSN
              value: host=netbird-postgres-rw port=5432 user=netbird password=$(NETBIRD_POSTGRES_PASSWORD) dbname=netbird sslmode=require
            - name: NB_ACTIVITY_EVENT_STORE_ENGINE
              value: postgres
            - name: NB_ACTIVITY_EVENT_POSTGRES_DSN
              value: host=netbird-postgres-rw port=5432 user=netbird password=$(NETBIRD_POSTGRES_PASSWORD) dbname=netbird_events sslmode=require
            # NOTE: management.jsonのEmbeddedIdP.Storageに展開する
            - name: NETBIRD_IDP_POSTGRES_DSN
              value: host=netbird-postgres-rw port=5432 user=netbird password=$(NETBIRD_POSTGRES_PASSWORD) dbname=netbird_auth sslmode=require
          ports:
            - name: http
              containerPort: 80
            - name: metrics
              containerPort: 9090
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            # TODO: 実測後に見直す
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            # NOTE: GeoLite2のファイルだけを置く。ファイルが無い場合、managementは起動時にダウンロードする
            - name: data
              mountPath: /var/lib/netbird
            - name: config
              mountPath: /etc/netbird
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: netbird-management
