apiVersion: v1
kind: Service
metadata:
  name: netbird-management
  namespace: netbird
spec:
  selector:
    app.kubernetes.io/name: netbird-management
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
---
# NOTE: managementは同じポートでgRPCとHTTPを受けるため、gatewayからHTTP/2で転送するgRPC用のService
apiVersion: v1
kind: Service
metadata:
  name: netbird-management-grpc
  namespace: netbird
spec:
  selector:
    app.kubernetes.io/name: netbird-management
  ports:
    - name: grpc
      port: 80
      targetPort: http
      appProtocol: kubernetes.io/h2c
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netbird-management
  namespace: netbird
spec:
  # NOTE: SQLiteとLitestreamは複数のレプリカに対応しない
  replicas: 1
  serviceName: netbird-management
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird-management
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: vultr
      tolerations:
        - key: edge
          operator: Exists
          effect: NoSchedule
      # NOTE: Vultrインスタンスの入れ替えでPVが失われたとき、R2の複製からDBを復元
      initContainers:
        - name: restore-store
          image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
          args: [restore, -if-db-not-exists, -if-replica-exists, /var/lib/netbird/store.db]
          env:
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: netbird-cloudflare
                  key: backup-access-key-id
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-cloudflare
                  key: backup-secret-access-key
          volumeMounts:
            - name: data
              mountPath: /var/lib/netbird
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
        - name: restore-events
          image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
          args: [restore, -if-db-not-exists, -if-replica-exists, /var/lib/netbird/events.db]
          env:
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: netbird-cloudflare
                  key: backup-access-key-id
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-cloudflare
                  key: backup-secret-access-key
          volumeMounts:
            - name: data
              mountPath: /var/lib/netbird
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
        - name: restore-idp
          image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
          args: [restore, -if-db-not-exists, -if-replica-exists, /var/lib/netbird/idp.db]
          env:
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: netbird-cloudflare
                  key: backup-access-key-id
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-cloudflare
                  key: backup-secret-access-key
          volumeMounts:
            - name: data
              mountPath: /var/lib/netbird
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
      containers:
        - name: management
          image: netbirdio/management:0.82.0@sha256:07c8f979fcc980678cc64e584cf6b7b27204ceb4c871531b29e2dce39592e9ff
          env:
            - name: NETBIRD_ACCESS_ISSUER
              valueFrom:
                secretKeyRef:
                  name: netbird-cloudflare
                  key: access-issuer
            - name: NETBIRD_ACCESS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: netbird-cloudflare
                  key: access-client-id
            - name: NETBIRD_ACCESS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: netbird-cloudflare
                  key: access-client-secret
            - name: NETBIRD_DATASTORE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: datastore-encryption-key
            - name: NETBIRD_RELAY_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: relay-auth-secret
            # NOTE: dashboardの初期設定画面を省略するための、ログインできないOwner
            - name: NETBIRD_PLACEHOLDER_OWNER_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: placeholder-owner-password-hash
            # NOTE: management.jsonを介さずmanagementが読む、組み込みIdPのCookieの暗号化鍵
            - name: NB_IDP_SESSION_COOKIE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: idp-session-cookie-encryption-key
          ports:
            - name: http
              containerPort: 80
            - name: metrics
              containerPort: 9090
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            # TODO: 実測後に見直す
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/netbird
            - name: config
              mountPath: /etc/netbird
              readOnly: true
        - name: litestream
          image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
          args: [replicate]
          env:
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: netbird-cloudflare
                  key: backup-access-key-id
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-cloudflare
                  key: backup-secret-access-key
          volumeMounts:
            - name: data
              mountPath: /var/lib/netbird
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
          resources:
            # TODO: 実測後に見直す
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: netbird-management
        - name: litestream-config
          configMap:
            name: netbird-litestream
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
