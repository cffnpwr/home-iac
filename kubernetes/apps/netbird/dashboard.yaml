apiVersion: v1
kind: Service
metadata:
  name: netbird-dashboard
  namespace: netbird
spec:
  selector:
    app.kubernetes.io/name: netbird-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-dashboard
  namespace: netbird
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird-dashboard
    spec:
      tolerations:
        - key: edge
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dashboard
          image: netbirdio/dashboard:v2.96.0@sha256:340b13c00b84349572a2acc5605e907cb09250a9e6461c757097eabdb8e02f2c
          env:
            - name: NETBIRD_MGMT_API_ENDPOINT
              value: https://netbird.cffnpwr.dev
            - name: NETBIRD_MGMT_GRPC_API_ENDPOINT
              value: https://nb.cffnpwr.dev
            - name: AUTH_AUDIENCE
              value: netbird-dashboard
            - name: AUTH_CLIENT_ID
              value: netbird-dashboard
            - name: AUTH_AUTHORITY
              value: https://netbird.cffnpwr.dev/oauth2
            - name: USE_AUTH0
              value: "false"
            - name: AUTH_SUPPORTED_SCOPES
              value: openid profile email groups
            - name: AUTH_REDIRECT_URI
              value: /nb-auth
            - name: AUTH_SILENT_REDIRECT_URI
              value: /nb-silent-auth
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            # TODO: 実測後に見直す
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
