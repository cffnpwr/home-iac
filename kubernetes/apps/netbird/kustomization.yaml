apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NOTE: netbird-cloudflareのSealedSecretは、再暗号化するworkflowがresourcesに追加
resources:
  - namespace.yaml
  - management.yaml
  - signal.yaml
  - relay.yaml
  - dashboard.yaml
  - gateway.yaml
  - netbird-secrets.yaml
  - netbird-cloudflare.yaml
  - netbird-mgmt-api-key.yaml
  - networkrouter.yaml
configMapGenerator:
  - name: netbird-management
    namespace: netbird
    files:
      - management.json
  - name: netbird-litestream
    namespace: netbird
    files:
      - litestream.yml
