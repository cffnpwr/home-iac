apiVersion: v1
kind: Service
metadata:
  name: netbird-relay
  namespace: netbird
spec:
  selector:
    app.kubernetes.io/name: netbird-relay
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: kubernetes.io/ws
---
# NOTE: STUNはHTTPのリバースプロキシを経由できないため、CiliumのNode IPAMでVultrノードのIPアドレスで直接受ける
apiVersion: v1
kind: Service
metadata:
  name: netbird-relay-stun
  namespace: netbird
  annotations:
    io.cilium.nodeipam/match-node-labels: topology.kubernetes.io/zone=vultr
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/node
  # NOTE: STUNはクライアントの送信元IPアドレスを返すため、送信元IPアドレスを保持する
  externalTrafficPolicy: Local
  # NOTE: 全ノードのIPアドレスでNodePortを受けないようにする
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: netbird-relay
  ports:
    - name: stun
      port: 3478
      targetPort: stun
      protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-relay
  namespace: netbird
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird-relay
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: vultr
      tolerations:
        - key: edge
          operator: Exists
          effect: NoSchedule
      containers:
        - name: relay
          image: netbirdio/relay:0.82.0@sha256:8f6b9e4193653ede89e83dd4aa4e2cf2562579b3e2481dcf259a7ab28bcd5fa1
          env:
            - name: NB_LISTEN_ADDRESS
              value: :80
            # NOTE: TLSはgatewayが終端するため、managementがピアに通知するアドレスのschemeを明示
            - name: NB_EXPOSED_ADDRESS
              value: rels://nb.cffnpwr.dev:443
            - name: NB_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: relay-auth-secret
            - name: NB_ENABLE_STUN
              value: "true"
          ports:
            - name: http
              containerPort: 80
            - name: stun
              containerPort: 3478
              protocol: UDP
            - name: health
              containerPort: 9000
            - name: metrics
              containerPort: 9090
          # NOTE: TCPソケットへの接続可能性でヘルスチェック
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            # TODO: 実測後に見直す
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
