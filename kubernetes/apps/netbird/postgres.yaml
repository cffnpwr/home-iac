apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: netbird-postgres
  namespace: netbird
spec:
  instances: 3
  inheritedMetadata:
    labels:
      # NOTE: メッシュ外のCloudNativePGのoperatorが接続するため、sidecarを注入しない
      sidecar.istio.io/inject: "false"
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-minimal-trixie@sha256:7c680fc840a9ea6bd04399f1aeea06bb3180df3f0969f18833925b6df3d7dc87
  bootstrap:
    initdb:
      database: netbird
      owner: netbird
  storage:
    storageClass: ceph-block
    size: 5Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: netbird-r2
  resources:
    # TODO: 実測後に見直す
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
---
# NOTE: activityのeventsと組み込みIdP（Dex）はstoreとは別のDBを使う
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: netbird-events
  namespace: netbird
spec:
  name: netbird_events
  owner: netbird
  cluster:
    name: netbird-postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: netbird-auth
  namespace: netbird
spec:
  name: netbird_auth
  owner: netbird
  cluster:
    name: netbird-postgres
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: netbird-r2
  namespace: netbird
spec:
  configuration:
    # NOTE: Barman Cloud PluginはClusterの名前のディレクトリに置く
    destinationPath: s3://home-iac-netbird-backup/
    endpointURL: https://086a84b440e09bc83330fe07f1966f5d.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId:
        name: netbird-cloudflare
        key: backup-access-key-id
      secretAccessKey:
        name: netbird-cloudflare
        key: backup-secret-access-key
    wal:
      compression: gzip
  retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: netbird-postgres
  namespace: netbird
spec:
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: netbird-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
