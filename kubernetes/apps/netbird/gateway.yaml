apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: netbird-peer
  namespace: netbird
spec:
  secretName: netbird-peer-tls
  dnsNames:
    - nb.cffnpwr.dev
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
---
# NOTE: istiodがGatewayから自動で作るDeploymentとServiceへのパッチ
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbird-gateway-options
  namespace: netbird
data:
  deployment: |
    spec:
      # NOTE: hostPortが同じノードで重複するため、古いPodを消してから新しいPodを作る
      strategy:
        type: Recreate
      template:
        spec:
          nodeSelector:
            topology.kubernetes.io/zone: vultr
          tolerations:
            - key: edge
              operator: Exists
              effect: NoSchedule
          containers:
            - name: istio-proxy
              ports:
                - containerPort: 443
                  hostPort: 443
                  protocol: TCP
              resources:
                # TODO: 実測後に見直す
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
  # NOTE: LoadBalancerが無いため、公開はhostPortで行う
  service: |
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: netbird
  namespace: netbird
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: netbird-gateway-options
  listeners:
    - name: https
      hostname: nb.cffnpwr.dev
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: netbird-peer-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: netbird
  namespace: netbird
spec:
  parentRefs:
    - name: netbird
  hostnames:
    - nb.cffnpwr.dev
  rules:
    - matches:
        - method:
            service: management.ManagementService
      backendRefs:
        - name: netbird-management-grpc
          port: 80
    - matches:
        - method:
            service: signalexchange.SignalExchange
      backendRefs:
        - name: netbird-signal-grpc
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird
  namespace: netbird
spec:
  parentRefs:
    - name: netbird
  hostnames:
    - nb.cffnpwr.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /relay
      backendRefs:
        - name: netbird-relay
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /ws-proxy/management
      backendRefs:
        - name: netbird-management
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /ws-proxy/signal
      backendRefs:
        - name: netbird-signal
          port: 80
