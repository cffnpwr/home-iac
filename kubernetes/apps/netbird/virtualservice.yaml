# NOTE: cloudflaredは公開ホスト名をHostヘッダーに入れるため、sidecarがServiceのclusterに転送するよう指定
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: netbird-dashboard
  namespace: netbird
spec:
  hosts:
    - netbird.cffnpwr.dev
  http:
    - match:
        - uri:
            # NOTE: cloudflaredはIngressのpathを先頭に固定しない正規表現として扱うため、同じ条件にする
            regex: .*/(api|oauth2)(/.*)?
      route:
        - destination:
            host: netbird-management.netbird.svc.cluster.local
            port:
              number: 80
    - route:
        - destination:
            host: netbird-dashboard.netbird.svc.cluster.local
            port:
              number: 80
