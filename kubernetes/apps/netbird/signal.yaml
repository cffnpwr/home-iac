apiVersion: v1
kind: Service
metadata:
  name: netbird-signal
  namespace: netbird
spec:
  selector:
    app.kubernetes.io/name: netbird-signal
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
---
# NOTE: signalは同じポートでgRPCとWebSocketを受けるため、gatewayからHTTP/2で転送するgRPC用のService
apiVersion: v1
kind: Service
metadata:
  name: netbird-signal-grpc
  namespace: netbird
spec:
  selector:
    app.kubernetes.io/name: netbird-signal
  ports:
    - name: grpc
      port: 80
      targetPort: http
      appProtocol: kubernetes.io/h2c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-signal
  namespace: netbird
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird-signal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird-signal
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: vultr
      containers:
        - name: signal
          image: netbirdio/signal:0.82.1@sha256:1735ff3b09c4fdace66ef38ffe6cded1821800ef78755560d918079aff2c7608
          ports:
            - name: http
              containerPort: 80
            - name: metrics
              containerPort: 9090
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            # TODO: 実測後に見直す
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
