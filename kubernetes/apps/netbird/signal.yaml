apiVersion: v1
kind: Service
metadata:
  name: netbird-signal
  namespace: netbird
spec:
  selector:
    app.kubernetes.io/name: netbird-signal
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
---
# NOTE: signalは同じポートでgRPCとWebSocketを受けるため、gatewayからHTTP/2で転送するgRPC用のService
apiVersion: v1
kind: Service
metadata:
  name: netbird-signal-grpc
  namespace: netbird
spec:
  selector:
    app.kubernetes.io/name: netbird-signal
  ports:
    - name: grpc
      port: 80
      targetPort: http
      appProtocol: kubernetes.io/h2c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-signal
  namespace: netbird
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird-signal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird-signal
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: vultr
      tolerations:
        - key: edge
          operator: Exists
          effect: NoSchedule
      containers:
        - name: signal
          image: netbirdio/signal:0.81.5@sha256:eea5dfeb5ad81216731a7c53b2a2b5b5a35115e66327bbd42c3704fc0b9a857e
          ports:
            - name: http
              containerPort: 80
            - name: metrics
              containerPort: 9090
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            # TODO: 実測後に見直す
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
