apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress-gateway
  namespace: istio-system
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: ingress
  ingress:
    # NOTE: インターネットのクライアントがHTTPS・gRPCで接続するためworldからの接続を許可
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # NOTE: NetBirdのルーティングピア等のPodがnb.cffnpwr.devに接続できるようすべてのnamespaceからの接続を許可
    #       クラスタ内のPodからLoadBalancerのIPアドレスへの通信はingress gatewayのPodに直接届き、worldとして扱われない
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
