global:
  domain: argocd.cffnpwr.dev

configs:
  cm:
    admin.enabled: false
    # NOTE: $argocd-oidc:<key>は、`app.kubernetes.io/part-of: argocd`のラベルを持つSecretのargocd-oidcの値
    oidc.config: |
      name: Cloudflare Access
      issuer: $argocd-oidc:issuer
      clientID: $argocd-oidc:client-id
      clientSecret: $argocd-oidc:client-secret
      # NOTE: Accessはoffline_accessを要求したときだけrefresh tokenを返す
      requestedScopes: ["openid", "profile", "email", "groups", "offline_access"]
      enablePKCEAuthentication: true
      # NOTE: AccessのID tokenの有効期間は5分。有効期限の2分前から、Accessのrefresh tokenでID tokenを更新
      refreshTokenThreshold: 2m
  params:
    # NOTE: server-side applyで同期するため、diffもserver-side applyのdry-runで計算
    controller.diff.server.side: true
    # NOTE: cloudflaredからはHTTPで受ける
    server.insecure: true
  rbac:
    # NOTE: ログインした全員に付くため、グループに属さないユーザーにロールを与えないよう空にする
    policy.default: ""
    policy.csv: |
      g, app-argocd-admin, role:admin

# NOTE: oidc.configでIdPに直接接続するため、Dexを使わない
dex:
  enabled: false

redis-ha:
  enabled: true
  podDisruptionBudget:
    maxUnavailable: 1
  # NOTE: chartの既定値はresourcesが無制限のため設定
  redis:
    resources:
      # TODO: 実測後に見直す
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
  sentinel:
    resources:
      # TODO: 実測後に見直す
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  haproxy:
    podDisruptionBudget:
      maxUnavailable: 1
    resources:
      # TODO: 実測後に見直す
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

server:
  ingress:
    enabled: true
    ingressClassName: cloudflare-tunnel
  replicas: 3
  env:
    - name: ARGOCD_API_SERVER_REPLICAS
      value: "3"
  pdb:
    enabled: true
    maxUnavailable: 1
  # NOTE: nodeTaintsPolicy: Honorで、Podが許容しないtaintを持つノード（drain中にcordonされたノード等）をskewの計算から除外
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-server
          app.kubernetes.io/instance: argocd
      matchLabelKeys:
        - pod-template-hash
      nodeTaintsPolicy: Honor

repoServer:
  replicas: 2
  pdb:
    enabled: true
    maxUnavailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-repo-server
          app.kubernetes.io/instance: argocd
      matchLabelKeys:
        - pod-template-hash
      nodeTaintsPolicy: Honor

applicationSet:
  replicas: 2
  pdb:
    enabled: true
    maxUnavailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-applicationset-controller
          app.kubernetes.io/instance: argocd
      matchLabelKeys:
        - pod-template-hash
      nodeTaintsPolicy: Honor
