global:
  domain: argocd.cffnpwr.dev

configs:
  cm:
    admin.enabled: false
    # NOTE: $argocd-oidc:<key>は、`app.kubernetes.io/part-of: argocd`のラベルを持つSecretのargocd-oidcの値
    oidc.config: |
      name: Cloudflare Access
      issuer: $argocd-oidc:issuer
      clientID: $argocd-oidc:client-id
      clientSecret: $argocd-oidc:client-secret
      # NOTE: Accessはoffline_accessを要求したときだけrefresh tokenを返す
      requestedScopes: ["openid", "profile", "email", "groups", "offline_access"]
      enablePKCEAuthentication: true
      # NOTE: AccessのID tokenの有効期間は5分。有効期限の2分前から、Accessのrefresh tokenでID tokenを更新
      refreshTokenThreshold: 2m
  params:
    # NOTE: server-side applyで同期するため、diffもserver-side applyのdry-runで計算
    controller.diff.server.side: true
    # NOTE: cloudflaredからはHTTPで受ける
    server.insecure: true
  rbac:
    # NOTE: ログインした全員に付くため、グループに属さないユーザーにロールを与えないよう空にする
    policy.default: ""
    policy.csv: |
      g, app-argocd-admin, role:admin

# NOTE: oidc.configでIdPに直接接続するため、Dexを使わない
dex:
  enabled: false

server:
  ingress:
    enabled: true
    ingressClassName: cloudflare-tunnel
