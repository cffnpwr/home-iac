# NOTE: cloudflaredは公開ホスト名をHostヘッダーに入れるため、sidecarがServiceのclusterに転送するよう指定
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: argocd-server
  namespace: argocd
spec:
  hosts:
    - argocd.cffnpwr.dev
  http:
    - route:
        - destination:
            host: argocd-server.argocd.svc.cluster.local
            port:
              number: 80
