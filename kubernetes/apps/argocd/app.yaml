# yaml-language-server: $schema=../../schemas/app.schema.json
# NOTE: 初回はTalosのinline manifestで導入し、以降の更新はこのApplicationで同期
namespace: argocd
chart:
  repoURL: https://argoproj.github.io/argo-helm
  name: argo-cd
  version: 10.18.0
  # NOTE: Terraformが初回導入時のhelm_templateでリリース名として参照するため明示
  releaseName: argocd
talosBootstrap: true
# NOTE: OIDCクライアントのSealedSecretをchartとあわせて同期
manifests: true
