ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
bpf:
  masquerade: true
  # NOTE: ルーティングテーブルを経由しないeBPF Host Routingが、KubeSpanの経路を迂回するため無効化
  hostLegacyRouting: true
hubble:
  tls:
    auto:
      # NOTE: 既定のhelmはテンプレート描画のたびに証明書を生成し、描画結果が変わる
      method: cronJob
# NOTE: cilium-agentは設定を起動時に読むため、ConfigMapの更新でPodを入れ替える
rollOutCiliumPods: true
# NOTE: Vultrノードで公開するServiceに、VultrノードのIPアドレスをLoadBalancerのIPアドレスとして割り当てる
nodeIPAM:
  enabled: true
operator:
  # NOTE: Node IPAMはoperatorが処理し、operatorは設定を起動時に読むため、ConfigMapの更新でPodを入れ替える
  rollOutPods: true
  # NOTE: chartの既定のtolerationsに、Vultrノードへのスケジューリングの許可を追加
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
    - key: node-role.kubernetes.io/master
      operator: Exists
    - key: node.kubernetes.io/not-ready
      operator: Exists
    - key: node.cloudprovider.kubernetes.io/uninitialized
      operator: Exists
    - key: edge
      operator: Exists
      effect: NoSchedule
