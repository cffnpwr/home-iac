[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]

[tools]
uv = "0.13.5"
terraform = "1.17.0"
tflint = "0.65.0"
"aqua:suzuki-shunsuke/tfcmt" = "4.14.19"
talosctl = "1.14.4"
kubectl = "1.37.1"
helm = "4.3.1"
kubeseal = "0.41.1"
yq = "4.54.1"
age = "1.3.2"
age-plugin-yubikey = { version = "0.5.1", os = ["macos"] }
"github:remko/age-plugin-se" = { version = "0.2.1", os = ["macos"] }
yamllint = "1.38.0"
"pypi:check-jsonschema" = "0.38.2"
shellcheck = "0.11.0"
rumdl = "0.3.0"
yamlfmt = "0.21.0"
"aqua:numtide/treefmt" = "2.6.0"
go = "1.27.3"
golangci-lint = "2.15.0"
python = "3.14.8"

[tasks.fmt]
description = "Terraform・YAML・Markdown・Goを整形する"
run = "treefmt"

[tasks.tf]
description = "terraform/でterraformを実行する"
dir = "{{config_root}}/terraform"
run = "terraform"

[tasks.lint]
description = "Terraform・YAML・Markdown・Go・シェルスクリプトを検査する"
# NOTE: 実バックエンドで初期化済みの`.terraform`を使うと`init -backend=false`がR2の認証情報を要求するため、検査用のDataDirを指定
env = { TF_DATA_DIR = "{{config_root}}/terraform/.terraform/lint" }
run = [
  "treefmt --ci",
  "mise run tf init -backend=false",
  "mise run tf validate",
  "tflint --recursive --config \"$MISE_PROJECT_ROOT/.tflint.hcl\"",
  "yamllint .",
  "check-jsonschema --schemafile kubernetes/schemas/app.schema.json kubernetes/apps/*/app.yaml",
  "sh kubernetes/scripts/check-helm-values.sh",
  # NOTE: gitignoreされた作業用・依存・状態のディレクトリを、shellcheckの対象から除外
  "find . \\( -name .git -o -name .jj -o -name .tmp -o -name .terraform \\) -prune -o -name '*.sh' -type f -exec shellcheck {} +",
  "rumdl check .",
  "cd \"$MISE_PROJECT_ROOT/terraform/modules/vultr/scripts\" && golangci-lint run",
  "cd \"$MISE_PROJECT_ROOT/images/kea-ha-peers\" && golangci-lint run",
]
