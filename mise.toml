[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]

[tools]
uv = "0.13.6"
terraform = "1.17.0"
tflint = "0.65.0"
"aqua:suzuki-shunsuke/tfcmt" = "4.14.20"
talosctl = "1.14.5"
kubectl = "1.37.1"
helm = "4.3.1"
kubeseal = "0.41.2"
yq = "4.54.1"
age = "1.3.2"
age-plugin-yubikey = { version = "0.5.1", os = ["macos"] }
"github:remko/age-plugin-se" = { version = "0.2.1", os = ["macos"] }
"github:netbirdio/netbird" = { version = "0.81.5", os = ["linux"] }
yamllint = "1.38.0"
"pypi:check-jsonschema" = "0.39.0"
shellcheck = "0.11.0"
rumdl = "0.3.0"
yamlfmt = "0.21.0"
"aqua:numtide/treefmt" = "2.6.0"
go = "1.27.3"
golangci-lint = "2.15.0"
python = "3.14.8"
k9s = "0.51.0"

[tasks.fmt]
description = "Terraform・YAML・Markdown・Goを整形する"
run = "treefmt"

[tasks.tf]
description = "terraform/でterraformを実行する"
dir = "{{config_root}}/terraform"
run = "terraform"

[tasks."tf:netbird"]
description = "terraform/netbird/でterraformを実行する"
dir = "{{config_root}}/terraform/netbird"
run = "terraform"

[tasks."sealed-secrets:seal-terraform-outputs"]
description = "Terraformのoutputの値を、cert.pemの証明書でSealedSecretに封入する"
run = "sh kubernetes/scripts/seal-terraform-outputs.sh"

[tasks."sealed-secrets:reseal"]
description = "SealedSecretを、sealed-secrets controllerの最新の鍵で再暗号化する"
run = "sh kubernetes/scripts/reseal-sealed-secrets.sh"

[tasks.lint]
description = "Terraform・YAML・Markdown・Go・シェルスクリプトを検査する"
depends = [
  "lint:format",
  "lint:terraform",
  "lint:yaml",
  "lint:schema",
  "lint:helm",
  "lint:shell",
  "lint:markdown",
  "lint:go:vultr",
  "lint:go:kea-ha-peers",
]

[tasks."lint:format"]
description = "整形済みであることを検査する"
run = "treefmt --ci"

[tasks."lint:terraform"]
description = "Terraformを検査する"
# NOTE: 実バックエンドで初期化済みの`.terraform`を使うと`init -backend=false`がR2の認証情報を要求するため、検査用のDataDirを指定
#       相対パスは各rootのディレクトリを基準に解決
env = { TF_DATA_DIR = ".terraform/lint" }
run = [
  "mise run tf init -backend=false",
  "mise run tf validate",
  "mise run tf:netbird init -backend=false",
  "mise run tf:netbird validate",
  "tflint --recursive --config \"$MISE_PROJECT_ROOT/.tflint.hcl\"",
]

[tasks."lint:yaml"]
description = "YAMLを検査する"
run = "yamllint ."

[tasks."lint:schema"]
description = "アプリケーション定義をJSON Schemaで検査する"
run = "check-jsonschema --schemafile kubernetes/schemas/app.schema.json kubernetes/apps/*/app.yaml"

[tasks."lint:helm"]
description = "Helmのvaluesを検査する"
run = "sh kubernetes/scripts/check-helm-values.sh"

[tasks."lint:shell"]
description = "シェルスクリプトを検査する"
# NOTE: gitignoreされた作業用・依存・状態のディレクトリを、shellcheckの対象から除外
run = "find . \\( -name .git -o -name .jj -o -name .tmp -o -name .terraform \\) -prune -o -name '*.sh' -type f -exec shellcheck {} +"

[tasks."lint:markdown"]
description = "Markdownを検査する"
run = "rumdl check ."

# NOTE: golangci-lintは既定で起動時にファイルロックを取得し、5秒以内に取得できないと失敗するため、並列実行を許可
[tasks."lint:go:vultr"]
description = "terraform/modules/vultr/scriptsのGoを検査する"
dir = "{{config_root}}/terraform/modules/vultr/scripts"
run = "golangci-lint run --allow-parallel-runners"

[tasks."lint:go:kea-ha-peers"]
description = "images/kea-ha-peersのGoを検査する"
dir = "{{config_root}}/images/kea-ha-peers"
run = "golangci-lint run --allow-parallel-runners"
