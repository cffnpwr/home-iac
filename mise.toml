[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]
npm.package_manager = "bun"

[tools]
bun = "1.4.3"
uv = "0.13.1"
python = "3.14.8"
terraform = "1.16.6"
tflint = "0.64.0"
talosctl = "1.14.4"
kubectl = "1.37.1"
helm = "4.3.1"
kubeseal = "0.40.0"
age = "1.3.2"
age-plugin-yubikey = { version = "0.5.1", os = ["macos"] }
"github:remko/age-plugin-se" = { version = "0.2.1", os = ["macos"] }
yamllint = "1.38.0"
markdownlint-cli2 = "0.23.3"
yamlfmt = "0.21.0"
"aqua:numtide/treefmt" = "2.6.0"

[tasks.fmt]
description = "Terraform・YAML・Markdownを整形する"
run = "treefmt"

[tasks.tf]
description = "terraform/でterraformを実行する"
dir = "{{config_root}}/terraform"
run = "terraform"

[tasks.lint]
description = "Terraform・YAML・Markdownを検査する"
run = [
  "treefmt --ci",
  "terraform -chdir=terraform init -backend=false",
  "terraform -chdir=terraform validate",
  "tflint --recursive --config \"$MISE_PROJECT_ROOT/.tflint.hcl\"",
  "yamllint .",
  "bun --bun run markdownlint-cli2 '**/*.md'",
]
