[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]

[tools]
uv = "0.13.7"
terraform = "1.17.2"
tflint = "0.66.0"
"aqua:suzuki-shunsuke/tfcmt" = "4.14.20"
talosctl = "1.14.6"
kubectl = "1.37.2"
helm = "4.3.2"
kubeseal = "0.41.2"
yq = "4.54.3"
age = "1.3.2"
age-plugin-yubikey = { version = "0.5.1", os = ["macos"] }
"github:remko/age-plugin-se" = { version = "0.2.1", os = ["macos"] }
"github:netbirdio/netbird" = { version = "v0.83.0", os = ["linux"] }
yamllint = "1.38.0"
"pypi:check-jsonschema" = "0.39.0"
shellcheck = "0.11.0"
rumdl = "v0.3.3"
yamlfmt = "0.21.0"
"aqua:numtide/treefmt" = "2.6.0"
go = "1.27.4"
golangci-lint = "2.15.0"
"go:golang.org/x/tools/gopls" = "0.24.0"
python = "3.14.8"
k9s = "0.51.0"
kyverno = "1.20.0"

[tasks.fmt]
description = "Terraform・YAML・Markdown・Goを整形する"
run = "treefmt"

[tasks.tf]
description = "terraform/でterraformを実行する"
dir = "{{config_root}}/terraform"
run = "terraform"

[tasks."tf:bootstrap"]
description = "terraform/bootstrap/でterraformを実行する"
dir = "{{config_root}}"
# NOTE: go runは実行したプログラムの終了ステータスを返さずterraformが0以外で終了すると1で終了する
#       --の後の引数をterraformに渡す
run = """
go run github.com/cffnpwr/actions/modules/terraform-r2-backend/cmd/terraform-bootstrap@41c85e705ed527974540a1bb0f9d57d7f7cc5281 \
  --cloudflare-account-id 086a84b440e09bc83330fe07f1966f5d \
  --root terraform/bootstrap \
  --sse-customer-key-file terraform/bootstrap/sse-customer-key.age \
  --"""

[tasks."tf:bootstrap:generate-sse-customer-key"]
description = "bootstrapのstateのSSE-Cの鍵を生成しageで暗号化してterraform/bootstrap/sse-customer-key.ageに書く"
dir = "{{config_root}}"
# NOTE: Sealed Secretsの鍵の退避Jobと同じ宛先に暗号化
run = """
go run github.com/cffnpwr/actions/modules/terraform-r2-backend/cmd/generate-sse-customer-key@41c85e705ed527974540a1bb0f9d57d7f7cc5281 \
  --output terraform/bootstrap/sse-customer-key.age \
  --recipients-file kubernetes/apps/sealed-secrets-backup/recipients.yaml \
  --recipients-key recipients.txt"""

[tasks."tf:netbird"]
description = "terraform/netbird/でterraformを実行する"
dir = "{{config_root}}/terraform/netbird"
run = "terraform"

[tasks."github:create-app:reseal"]
description = "SealedSecretの再暗号化のGitHub Appをmanifest flowで作成しClient IDと秘密鍵をenvironmentに登録する"
dir = "{{config_root}}"
run = "go run github.com/cffnpwr/actions/modules/github-app/cmd/create-github-app@41c85e705ed527974540a1bb0f9d57d7f7cc5281 --config .github/apps/reseal.yaml --repo cffnpwr/home-iac"

[tasks."github:create-app:backup"]
description = "鍵の退避JobのGitHub Appをmanifest flowで作成しClient IDと秘密鍵をSealedSecretに封入する"
dir = "{{config_root}}"
env = { CREATE_GITHUB_APP = "github.com/cffnpwr/actions/modules/github-app/cmd/create-github-app@41c85e705ed527974540a1bb0f9d57d7f7cc5281" }
run = "sh kubernetes/scripts/create-backup-github-app.sh"

[tasks."sealed-secrets:seal-terraform-outputs"]
description = "Terraformのoutputの値を、cert.pemの証明書でSealedSecretに封入する"
run = "sh kubernetes/scripts/seal-terraform-outputs.sh"

[tasks."sealed-secrets:reseal"]
description = "SealedSecretを、sealed-secrets controllerの最新の鍵で再暗号化する"
run = "sh kubernetes/scripts/reseal-sealed-secrets.sh"

[tasks.lint]
description = "Terraform・YAML・Markdown・Go・シェルスクリプトを検査する"
depends = [
  "lint:format",
  "lint:terraform",
  "lint:yaml",
  "lint:schema",
  "lint:helm",
  "lint:shell",
  "lint:markdown",
  "lint:go:vultr",
  "lint:go:kea-ha-peers",
  "lint:go:gopls",
]

[tasks."lint:format"]
description = "整形済みであることを検査する"
run = "treefmt --ci"

[tasks."lint:terraform"]
description = "Terraformを検査する"
# NOTE: 実バックエンドで初期化済みの`.terraform`を使うと`init -backend=false`がR2の認証情報を要求するため、検査用のDataDirを指定
#       相対パスは各rootのディレクトリを基準に解決
env = { TF_DATA_DIR = ".terraform/lint" }
run = [
  "mise run tf init -backend=false",
  "mise run tf validate",
  "terraform -chdir=terraform/bootstrap init -backend=false",
  "terraform -chdir=terraform/bootstrap validate",
  "mise run tf:netbird init -backend=false",
  "mise run tf:netbird validate",
  "tflint --recursive --config \"$MISE_PROJECT_ROOT/.tflint.hcl\"",
]

[tasks."lint:yaml"]
description = "YAMLを検査する"
run = "yamllint ."

[tasks."lint:schema"]
description = "アプリケーション定義をJSON Schemaで検査する"
run = "check-jsonschema --schemafile kubernetes/schemas/app.schema.json kubernetes/apps/*/app.yaml"

[tasks."lint:helm"]
description = "Helmのvaluesを検査する"
run = "sh kubernetes/scripts/check-helm-values.sh"

[tasks."lint:shell"]
description = "シェルスクリプトを検査する"
# NOTE: gitignoreされた作業用・依存・状態のディレクトリを、shellcheckの対象から除外
run = "find . \\( -name .git -o -name .jj -o -name .tmp -o -name .terraform \\) -prune -o -name '*.sh' -type f -exec shellcheck {} +"

[tasks."lint:markdown"]
description = "Markdownを検査する"
run = "rumdl check ."

# NOTE: golangci-lintは既定で起動時にファイルロックを取得し、5秒以内に取得できないと失敗するため、並列実行を許可
[tasks."lint:go:vultr"]
description = "terraform/modules/vultr/scriptsのGoを検査する"
dir = "{{config_root}}/terraform/modules/vultr/scripts"
run = "golangci-lint run --allow-parallel-runners"

[tasks."lint:go:kea-ha-peers"]
description = "images/kea-ha-peersのGoを検査する"
dir = "{{config_root}}/images/kea-ha-peers"
run = "golangci-lint run --allow-parallel-runners"

[tasks."lint:go:gopls"]
description = "goplsの診断でリポジトリのすべてのGoを検査する"
dir = "{{config_root}}"
# NOTE: gopls checkは診断があっても終了ステータス0で終了するため、診断を出力した場合に失敗させる
run = """
diagnostics=$(find . -path ./.tmp -prune -o -path '*/.terraform' -prune -o -name '*.go' -print | xargs gopls check) || exit
if [ -n "$diagnostics" ]; then
  printf '%s\n' "$diagnostics"
  exit 1
fi
"""
