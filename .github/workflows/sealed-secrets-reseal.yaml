name: Reseal SealedSecrets
on:
  # NOTE: 鍵の退避Jobが新しい鍵の退避後に、証明書を入れて送るイベント
  repository_dispatch:
    types:
      - sealed-secrets-key-added
  # NOTE: 鍵の更新以外でoutputのsealed_secretsが変わったときの手動実行用
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  reseal:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: sealed-secrets-reseal
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: "true"
      # NOTE: repository_dispatch以外での封入に使う、controllerの最新の証明書のパス
      CERT: kubernetes/platform/sealed-secrets/cert.pem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: mise run tf init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Read Terraform outputs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          OUTPUTS_DIR=$RUNNER_TEMP/terraform-outputs
          echo "OUTPUTS_DIR=$OUTPUTS_DIR" >> "$GITHUB_ENV"
          mkdir -p "$OUTPUTS_DIR"
          for name in sealed_secrets sealed_secrets_data_hmac_key sealed_secrets_cert; do
            mise run tf output -json "$name" > "$OUTPUTS_DIR/$name.json"
          done
          # NOTE: runnerがstdoutを1行ずつコマンドとして読むため、sensitiveな値を行ごとにマスク
          {
            jq -r '.[].data[]' "$OUTPUTS_DIR/sealed_secrets.json"
            jq -r . "$OUTPUTS_DIR/sealed_secrets_data_hmac_key.json"
          } | while IFS= read -r line; do
            if [[ -n $line ]]; then
              echo "::add-mask::$line"
            fi
          done
          jq -r 'keys[]' "$OUTPUTS_DIR/sealed_secrets.json" > "$OUTPUTS_DIR/paths.txt"
      - name: Select the certificate
        env:
          DISPATCHED_CERT: ${{ github.event.client_payload.cert }}
        run: |
          if [[ -n $DISPATCHED_CERT ]]; then
            echo "Using the certificate from repository_dispatch."
            printf '%s\n' "$DISPATCHED_CERT" > "$RUNNER_TEMP/cert.pem"
          elif [[ -f $CERT ]]; then
            echo "Using the certificate in the repository."
            cp "$CERT" "$RUNNER_TEMP/cert.pem"
          else
            echo "$CERT not found. Using the initial certificate from Terraform."
            jq -r . "$OUTPUTS_DIR/sealed_secrets_cert.json" > "$RUNNER_TEMP/cert.pem"
          fi
          # NOTE: 証明書として読めない内容での封入の防止
          openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout
          mkdir -p "$(dirname "$CERT")"
          cp "$RUNNER_TEMP/cert.pem" "$CERT"
      - name: Reseal
        run: |
          cert_sha256=$(openssl x509 -in "$CERT" -noout -fingerprint -sha256 | cut -d = -f 2 | tr -d : | tr '[:upper:]' '[:lower:]')
          hmac_key=$(jq -r . "$OUTPUTS_DIR/sealed_secrets_data_hmac_key.json")
          while IFS= read -r path; do
            # NOTE: resourcesに列挙していないファイルは、kustomizeの適用対象外
            kustomization=$(dirname "$path")/kustomization.yaml
            resource=$(basename "$path")
            export resource
            if [[ -f $kustomization ]] && [[ $(yq '.resources // [] | any_c(. == strenv(resource))' "$kustomization") != true ]]; then
              yq -i '.resources += [strenv(resource)]' "$kustomization"
            fi

            entry=$(jq -c --arg path "$path" '.[$path]' "$OUTPUTS_DIR/sealed_secrets.json")
            data_hmac_sha256=$(printf '%s' "$(jq -cS .data <<<"$entry")" \
              | openssl dgst -sha256 -mac HMAC -macopt "hexkey:$hmac_key" -r | cut -d ' ' -f 1)

            if [[ -f $path ]] \
              && [[ $(yq '.metadata.annotations["home-iac/cert-sha256"] // ""' "$path") == "$cert_sha256" ]] \
              && [[ $(yq '.metadata.annotations["home-iac/data-hmac-sha256"] // ""' "$path") == "$data_hmac_sha256" ]]; then
              echo "$path: up to date"
              continue
            fi

            echo "$path: resealing"
            mkdir -p "$(dirname "$path")"
            jq '{apiVersion: "v1", kind: "Secret", metadata: {name, namespace}, data: (.data | map_values(@base64))}' <<<"$entry" \
              | kubeseal --cert "$CERT" --format json \
              | jq --arg cert "$cert_sha256" --arg hmac "$data_hmac_sha256" \
                '.metadata.annotations += {"home-iac/cert-sha256": $cert, "home-iac/data-hmac-sha256": $hmac}' \
              | yq -p json -o yaml > "$path"
          done < "$OUTPUTS_DIR/paths.txt"
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPDATE_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create a pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH_PREFIX: reseal-sealed-secrets/
          TITLE: "chore: :lock: Reseal SealedSecrets with the latest certificate"
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |-
          git add -- "$CERT"
          while IFS= read -r path; do
            git add -- "$path"
            if [[ -f $(dirname "$path")/kustomization.yaml ]]; then
              git add -- "$(dirname "$path")/kustomization.yaml"
            fi
          done < "$OUTPUTS_DIR/paths.txt"
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          branch="$BRANCH_PREFIX$(date -u +%Y%m%d%H%M%S)"
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -m "$TITLE"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$branch"

          if [[ $EVENT_NAME == repository_dispatch ]]; then
            reason="The sealed-secrets controller added a new key, and the backup Job sent its certificate after backing up the key."
          else
            reason="The values in the Terraform output \`sealed_secrets\` may have changed."
          fi
          fingerprint=$(openssl x509 -in "$CERT" -noout -fingerprint -sha256 | cut -d = -f 2)
          {
            echo "## What"
            echo
            echo "Reseal SealedSecrets with the latest certificate of the sealed-secrets controller."
            echo
            echo "The SHA-256 fingerprint of the certificate is \`$fingerprint\`."
            echo
            echo "## Why"
            echo
            echo "$reason"
            echo
            echo "This pull request was created by [the workflow run]($RUN_URL) triggered by \`$EVENT_NAME\`."
          } > "$RUNNER_TEMP/pr-body.md"

          if [[ -z $(gh pr list --head "$branch" --state open --json number --jq '.[].number') ]]; then
            gh pr create --base main --head "$branch" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
          gh pr merge "$branch" --auto --squash
