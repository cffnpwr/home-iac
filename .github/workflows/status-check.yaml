name: Status check
on:
  # NOTE: 呼び出すcffnpwr/actionsのworkflowはPRのコードをcheckoutせず実行もしない
  #       トークンの権限も読み取りだけのため、PRのコードがリポジトリの権限で実行されるdangerous-triggersの危険は無い
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  status-check:
    uses: cffnpwr/actions/.github/workflows/status-check.yaml@c6980dae0015e18a727ed32611a377a8f0df5dd7 # main
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      statuses: read
