name: Status check
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  status-check:
    uses: cffnpwr/actions/.github/workflows/status-check.yaml@a826b45dc00531b0bbeb70dc624015f32040bc34 # main
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      statuses: read
