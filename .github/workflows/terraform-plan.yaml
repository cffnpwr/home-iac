name: Terraform plan
on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/terraform-plan.yaml"
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: terraform-plan
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"
      # NOTE: cacheはLint workflowがmainへのpushで保存
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: terraform-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run tf init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPDATE_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_PRIVATE_KEY }}
          permission-actions: read
          permission-environments: read
      - run: tfcmt plan -patch -disable-label -- mise run tf plan -input=false -lock=false
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          TF_VAR_github_token: ${{ steps.app-token.outputs.token }}
          TF_VAR_github_app_client_id: ${{ vars.UPDATE_CLIENT_ID }}
          TF_VAR_github_app_private_key: ${{ secrets.UPDATE_PRIVATE_KEY }}
