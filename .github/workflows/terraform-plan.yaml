name: Terraform plan
on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/netbird/**"
      - ".github/workflows/terraform-plan.yaml"
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform
          - terraform/netbird
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: terraform-plan
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"
      # NOTE: cacheはLint workflowがmainへのpushで保存
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('terraform/.terraform.lock.hcl', 'terraform/netbird/.terraform.lock.hcl') }}
          restore-keys: terraform-${{ runner.os }}-${{ runner.arch }}-
      - run: terraform -chdir="$ROOT" init -input=false
        env:
          ROOT: ${{ matrix.root }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPDATE_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_PRIVATE_KEY }}
          permission-actions: read
          permission-environments: read
          permission-secrets: read
          # NOTE: GitHub AppのVariablesの権限名はactions_variables。action.ymlに無い入力のため、runnerはUnexpected inputの警告を出す
          #       actionはpermission-*の入力をすべてトークンの権限に使う
          permission-actions-variables: read
      # NOTE: Talos providerがTalos APIに接続できないと、talos_machineごとにrefreshを2分間試行し続けるため
      - if: matrix.root == 'terraform'
        uses: $/.github/actions/netbird
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          wait-address: 192.168.0.129:50000
      # NOTE: rootごとにPRのコメントを分けるため、targetにrootのディレクトリを指定
      - if: matrix.root == 'terraform'
        run: tfcmt -var "target:$ROOT" plan -patch -disable-label -- terraform -chdir="$ROOT" plan -input=false -lock=false
        env:
          ROOT: ${{ matrix.root }}
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          TF_VAR_github_token: ${{ steps.app-token.outputs.token }}
          TF_VAR_github_app_private_key: ${{ secrets.UPDATE_PRIVATE_KEY }}
      - if: matrix.root == 'terraform/netbird'
        run: tfcmt -var "target:$ROOT" plan -patch -disable-label -- terraform -chdir="$ROOT" plan -input=false -lock=false
        env:
          ROOT: ${{ matrix.root }}
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          NB_PAT: ${{ secrets.NB_PAT }}
          TF_VAR_github_token: ${{ steps.app-token.outputs.token }}
