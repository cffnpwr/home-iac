name: Terraform plan
on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      # NOTE: bootstrapのrootは手元でapplyするためCIのplanの対象外
      - "!terraform/bootstrap/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/netbird/**"
      - ".github/workflows/terraform-plan.yaml"
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform
          - terraform/netbird
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: terraform-plan
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"
      # NOTE: cacheはLint workflowがmainへのpushで保存
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('terraform/.terraform.lock.hcl', 'terraform/bootstrap/.terraform.lock.hcl', 'terraform/netbird/.terraform.lock.hcl') }}
          restore-keys: terraform-${{ runner.os }}-${{ runner.arch }}-
      - run: terraform -chdir="$ROOT" init -input=false
        env:
          ROOT: ${{ matrix.root }}
          AWS_ACCESS_KEY_ID: ${{ matrix.root == 'terraform' && secrets.AWS_ACCESS_KEY_ID || secrets.NETBIRD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ matrix.root == 'terraform' && secrets.AWS_SECRET_ACCESS_KEY || secrets.NETBIRD_AWS_SECRET_ACCESS_KEY }}
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PLAN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLAN_APP_PRIVATE_KEY }}
          permission-environments: read
      # NOTE: Talos providerがTalos APIに接続できないと、talos_machineごとにrefreshを2分間試行し続けるため
      - if: matrix.root == 'terraform'
        uses: $/.github/actions/netbird
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          wait-address: 192.168.0.129:50000
      # NOTE: rootごとにPRのコメントを分けるため、targetにrootのディレクトリを指定
      - if: matrix.root == 'terraform'
        run: tfcmt -var "target:$ROOT" plan -patch -disable-label -- terraform -chdir="$ROOT" plan -input=false -lock=false
        env:
          ROOT: ${{ matrix.root }}
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          TF_VAR_github_token: ${{ steps.app-token.outputs.token }}
          TF_VAR_pocket_id_access_client_secret: ${{ secrets.POCKET_ID_ACCESS_CLIENT_SECRET }}
          TF_VAR_talos_machine_secrets: ${{ secrets.TALOS_MACHINE_SECRETS }}
          TF_VAR_sealed_secrets_private_key: ${{ secrets.SEALED_SECRETS_PRIVATE_KEY }}
          TF_VAR_sealed_secrets_cert: ${{ vars.SEALED_SECRETS_CERT }}
          TF_VAR_google_workspace_access_identity_provider_id: ${{ vars.GOOGLE_WORKSPACE_ACCESS_IDENTITY_PROVIDER_ID }}
      - if: matrix.root == 'terraform/netbird'
        run: tfcmt -var "target:$ROOT" plan -patch -disable-label -- terraform -chdir="$ROOT" plan -input=false -lock=false
        env:
          ROOT: ${{ matrix.root }}
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NETBIRD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NETBIRD_AWS_SECRET_ACCESS_KEY }}
          NB_PAT: ${{ secrets.NB_PAT }}
          TF_VAR_github_token: ${{ steps.app-token.outputs.token }}
