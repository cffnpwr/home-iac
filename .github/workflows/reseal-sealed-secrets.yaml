name: Reseal SealedSecrets
on:
  # NOTE: 鍵の退避Jobが新しい鍵の退避後に、証明書を入れて送るイベント
  repository_dispatch:
    types:
      - sealed-secrets-key-added
  # NOTE: 鍵の更新以外でoutputのsealed_secretsが変わったときの手動実行用
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  reseal:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: sealed-secrets-reseal
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: "true"
      # NOTE: sealed-secrets:seal-terraform-outputsが封入に使う、controllerの最新の証明書のパス
      CERT: kubernetes/apps/sealed-secrets/cert.pem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"
      # NOTE: cacheはLint workflowがmainへのpushで保存
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('terraform/.terraform.lock.hcl', 'terraform/netbird/.terraform.lock.hcl') }}
          restore-keys: terraform-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run tf init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # NOTE: runnerがstdoutを1行ずつコマンドとして読むため、sensitiveな値を行ごとにマスク
      - name: Mask Terraform outputs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          {
            mise run tf output -json sealed_secrets | jq -r '.[].data[]'
            mise run tf output -raw sealed_secrets_data_hmac_key
            echo
          } | while IFS= read -r line; do
            if [[ -n $line ]]; then
              echo "::add-mask::$line"
            fi
          done
      # NOTE: 鍵の退避Jobが送った証明書を、封入に使う証明書のパスに書き込む
      - name: Write the dispatched certificate
        if: github.event_name == 'repository_dispatch'
        env:
          DISPATCHED_CERT: ${{ github.event.client_payload.cert }}
        run: |
          mkdir -p "$(dirname "$CERT")"
          printf '%s\n' "$DISPATCHED_CERT" > "$CERT"
      - name: Seal Terraform outputs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: mise run sealed-secrets:seal-terraform-outputs
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPDATE_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create a pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH_PREFIX: reseal-sealed-secrets/
          TITLE: "chore: :lock: Reseal SealedSecrets with the latest certificate"
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |-
          # NOTE: 変更するのは証明書・SealedSecret・resourcesを追加したkustomization.yamlで、いずれもkubernetes/の下にある
          git add -- kubernetes
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          branch="$BRANCH_PREFIX$(date -u +%Y%m%d%H%M%S)"
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -m "$TITLE"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$branch"

          if [[ $EVENT_NAME == repository_dispatch ]]; then
            reason="The sealed-secrets controller added a new key, and the backup Job sent its certificate after backing up the key."
          else
            reason="The values in the Terraform output \`sealed_secrets\` may have changed."
          fi
          fingerprint=$(openssl x509 -in "$CERT" -noout -fingerprint -sha256 | cut -d = -f 2)
          {
            echo "## What"
            echo
            echo "Reseal SealedSecrets with the latest certificate of the sealed-secrets controller."
            echo
            echo "The SHA-256 fingerprint of the certificate is \`$fingerprint\`."
            echo
            echo "## Why"
            echo
            echo "$reason"
            echo
            echo "This pull request was created by [the workflow run]($RUN_URL) triggered by \`$EVENT_NAME\`."
          } > "$RUNNER_TEMP/pr-body.md"

          if [[ -z $(gh pr list --head "$branch" --state open --json number --jq '.[].number') ]]; then
            gh pr create --base main --head "$branch" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
          gh pr merge "$branch" --auto --squash
