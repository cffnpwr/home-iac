name: Reseal SealedSecrets
on:
  # NOTE: 鍵の退避Jobが新しい鍵の退避後に、証明書を入れて送るイベント
  repository_dispatch:
    types:
      - sealed-secrets-key-added
  # NOTE: 鍵の更新以外でoutputのsealed_secretsが変わったときの手動実行用
  workflow_dispatch:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      NETBIRD_SETUP_KEY:
        required: true
      RESEAL_APP_PRIVATE_KEY:
        required: true
      SEALED_SECRETS_DATA_HMAC_KEY:
        required: true
# NOTE: workflow_callでは`github.workflow_ref`が呼び出し元のworkflowになるため、固定の名前で起動方法によらず直列化
concurrency:
  group: sealed-secrets-reseal
  cancel-in-progress: false
permissions: {}
jobs:
  reseal:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: sealed-secrets-reseal
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: "true"
      # NOTE: sealed-secrets:seal-terraform-outputsが封入に使う、controllerの最新の証明書のパス
      CERT: kubernetes/apps/sealed-secrets/cert.pem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"
      # NOTE: cacheはLint workflowがmainへのpushで保存
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('terraform/.terraform.lock.hcl', 'terraform/bootstrap/.terraform.lock.hcl', 'terraform/netbird/.terraform.lock.hcl') }}
          restore-keys: terraform-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run tf init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # NOTE: runnerがstdoutを1行ずつコマンドとして読むため、sensitiveな値を行ごとにマスク
      - name: Mask Terraform outputs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mise run tf output -json sealed_secrets | jq -r '.[].data[]' | while IFS= read -r line; do
            if [[ -n $line ]]; then
              echo "::add-mask::$line"
            fi
          done
      # NOTE: 鍵の退避Jobが送った証明書を、封入に使う証明書のパスに書き込む
      - name: Write the dispatched certificate
        if: github.event_name == 'repository_dispatch'
        env:
          DISPATCHED_CERT: ${{ github.event.client_payload.cert }}
        run: |
          mkdir -p "$(dirname "$CERT")"
          printf '%s\n' "$DISPATCHED_CERT" > "$CERT"
      - name: Seal Terraform outputs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SEALED_SECRETS_DATA_HMAC_KEY: ${{ secrets.SEALED_SECRETS_DATA_HMAC_KEY }}
          SEALED_SECRETS_CERT: ${{ vars.SEALED_SECRETS_CERT }}
        run: mise run sealed-secrets:seal-terraform-outputs
      # NOTE: 既存のSealedSecretの再暗号化はcontrollerが行うため、netbird経由でクラスタに接続
      - uses: $/.github/actions/netbird
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          wait-address: 192.168.0.129:50000
      - name: Fetch kubeconfig
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          (umask 077 && mise run tf output -raw talosconfig > "$RUNNER_TEMP/talosconfig")
          talosctl --talosconfig "$RUNNER_TEMP/talosconfig" kubeconfig "$RUNNER_TEMP/kubeconfig"
          rm -f "$RUNNER_TEMP/talosconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      # NOTE: 既存のすべてのSealedSecretを、controllerの最新の鍵で再暗号化
      - name: Reseal
        run: mise run sealed-secrets:reseal
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RESEAL_APP_CLIENT_ID }}
          private-key: ${{ secrets.RESEAL_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: pr-params
        name: Prepare the pull request
        env:
          BRANCH_PREFIX: reseal-sealed-secrets/
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |-
          echo "branch=$BRANCH_PREFIX$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

          if [[ $EVENT_NAME == repository_dispatch ]]; then
            reason="The sealed-secrets controller added a new key, and the backup Job sent its certificate after backing up the key."
          else
            reason="The values in the Terraform output \`sealed_secrets\` may have changed."
          fi
          fingerprint=$(openssl x509 -in "$CERT" -noout -fingerprint -sha256 | cut -d = -f 2)
          {
            echo "## What"
            echo
            echo "Reseal SealedSecrets with the latest certificate of the sealed-secrets controller."
            echo
            echo "The values in the Terraform output \`sealed_secrets\` are sealed with the certificate, and all existing SealedSecrets are re-encrypted with the latest key by the controller."
            echo
            echo "The SHA-256 fingerprint of the certificate is \`$fingerprint\`."
            echo
            echo "## Why"
            echo
            echo "$reason"
            echo
            echo "This pull request was created by [the workflow run]($RUN_URL) triggered by \`$EVENT_NAME\`."
          } > "$RUNNER_TEMP/pr-body.md"
      - id: create-pr
        name: Create a pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          add-paths: kubernetes
          base: main
          branch: ${{ steps.pr-params.outputs.branch }}
          commit-message: "chore: :lock: Reseal SealedSecrets with the latest certificate"
          title: "chore: :lock: Reseal SealedSecrets with the latest certificate"
          body-path: ${{ runner.temp }}/pr-body.md
      # NOTE: 変更が無い場合、actionはpull requestを作らずに終了するため、作成・更新したときだけ自動マージを設定
      #       ref: https://github.com/peter-evans/create-pull-request/blob/v8.1.3/README.md#action-behaviour
      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-operation == 'created' || steps.create-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
