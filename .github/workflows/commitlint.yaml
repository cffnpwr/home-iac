name: commitlint
on:
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  commitlint:
    uses: cffnpwr/actions/.github/workflows/commitlint.yaml@41c85e705ed527974540a1bb0f9d57d7f7cc5281 # main
    permissions:
      contents: read
      actions: read
