name: commitlint
on:
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  commitlint:
    uses: cffnpwr/actions/.github/workflows/commitlint.yaml@22249f85c8770795a96ebd572d951458558f9937 # main
    permissions:
      contents: read
      actions: read
