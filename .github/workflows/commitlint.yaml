name: commitlint
on:
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  commitlint:
    uses: cffnpwr/actions/.github/workflows/commitlint.yaml@889c9d54e6170ddeb4789778e9edbcbd2ef3e49a # main
    permissions:
      contents: read
      actions: read
