name: commitlint
on:
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  commitlint:
    uses: cffnpwr/actions/.github/workflows/commitlint.yaml@2cfa265cdfaf92bcafe070d7859e5ec1d50edfa1 # main
    permissions:
      contents: read
      actions: read
