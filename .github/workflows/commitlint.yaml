name: commitlint
on:
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  commitlint:
    uses: cffnpwr/actions/.github/workflows/commitlint.yaml@7c32a97d49225b745038dc54a998dbe1eb14dd71 # main
    permissions:
      contents: read
      actions: read
