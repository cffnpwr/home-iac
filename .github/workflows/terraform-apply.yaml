name: Terraform apply
on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/netbird/**"
      - ".github/workflows/terraform-apply.yaml"
  workflow_dispatch:
# NOTE: 途中で止めたapplyはstateのロックとリソースの不整合を残すため、実行中のapplyを取り消さない
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  apply:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: terraform-apply
    permissions:
      contents: read
      # NOTE: tfcmtがマージしたPRにapplyの結果をコメントするため
      pull-requests: write
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"
      # NOTE: cacheはLint workflowがmainへのpushで保存
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('terraform/.terraform.lock.hcl', 'terraform/netbird/.terraform.lock.hcl') }}
          restore-keys: terraform-${{ runner.os }}-${{ runner.arch }}-
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPDATE_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_PRIVATE_KEY }}
          permission-actions: read
          permission-administration: write
          permission-environments: write
          permission-secrets: write
          # NOTE: GitHub AppのVariablesの権限名はactions_variables。action.ymlに無い入力のため、runnerはUnexpected inputの警告を出す
          #       actionはpermission-*の入力をすべてトークンの権限に使う
          permission-actions-variables: write
      # NOTE: クラスタのrootがTalos API・kube-apiserverに接続するため
      - uses: $/.github/actions/netbird
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          wait-address: 192.168.0.129:50000
      # NOTE: S3 backendの認証情報は、CLOUDFLARE_API_TOKENのトークンから作る
      #       R2のAccess Key IDはAPIトークンのID、Secret Access KeyはAPIトークンの値をSHA-256でハッシュ化した値
      - name: Apply terraform
        run: |
          AWS_ACCESS_KEY_ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | jq -er .result.id)
          AWS_SECRET_ACCESS_KEY=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d ' ' -f 1)
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          terraform -chdir=terraform init -input=false
          tfcmt -var target:terraform apply -- terraform -chdir=terraform apply -input=false -auto-approve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: 086a84b440e09bc83330fe07f1966f5d
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          TF_VAR_github_token: ${{ steps.app-token.outputs.token }}
          TF_VAR_github_app_private_key: ${{ secrets.UPDATE_PRIVATE_KEY }}
          TF_VAR_pocket_id_access_client_secret: ${{ secrets.POCKET_ID_ACCESS_CLIENT_SECRET }}
          TF_VAR_google_workspace_access_client_secret: ${{ secrets.GOOGLE_WORKSPACE_ACCESS_CLIENT_SECRET }}
      # NOTE: netbirdのrootはクラスタのrootが使う接続のポリシーを変更しうるため、クラスタのrootの後に実行
      #       2つのrootは独立しているため、クラスタのrootの成否に関係なく実行
      - name: Apply terraform/netbird
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        run: |
          terraform -chdir=terraform/netbird init -input=false
          tfcmt -var target:terraform/netbird apply -- terraform -chdir=terraform/netbird apply -input=false -auto-approve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NETBIRD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NETBIRD_AWS_SECRET_ACCESS_KEY }}
          NB_PAT: ${{ secrets.NB_PAT }}
          TF_VAR_github_token: ${{ steps.app-token.outputs.token }}
  reseal:
    needs: apply
    uses: $/.github/workflows/reseal-sealed-secrets.yaml
    permissions:
      contents: read
    # NOTE: environmentのシークレットも呼び出し元が渡す必要がある。呼び出し先のjobはenvironmentの値を優先して使う
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
      UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
