[formatter.terraform]
command = "terraform"
options = ["fmt"]
includes = ["*.tf", "*.tfvars"]

[formatter.yaml]
command = "yamlfmt"
includes = ["*.yaml", "*.yml"]

[formatter.markdown]
command = "rumdl"
options = ["fmt"]
includes = ["*.md"]

[formatter.go]
command = "golangci-lint"
options = ["fmt"]
includes = ["*.go"]
